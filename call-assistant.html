<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="google" content="notranslate">
<meta name="theme-color" content="#FBF9F4">
<title>Call Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Separate requests on purpose: css2 fails the WHOLE response if any one
     family name is unknown, so one bad family must not take the others down. -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   CALL ASSISTANT — cockpit type scale + AAA palette
   Target: read in ~400ms under adrenaline. Not a document.

   Two scales, because the two tasks invert:
     .phrase--self   he must SPEAK it     -> romaji 32px leads
     .phrase--staff  he must UNDERSTAND it -> english 28px leads
   Both classes are already emitted by ui.js. No JS change required.

   Hierarchy here is built from SIZE and WEIGHT, never from dimming.
   Under a 7:1 floor, contrast is no longer available as a ranking device.
   ========================================================================== */

:root{
  /* Positive polarity. Dense kanji halate badly as light-on-dark, and the
     call window is 12:00-14:00 WIB - a daylight room. */
  --ground:      #FBF9F4;
  --surface:     #F1ECE0;   /* header, panic tiles, composer */
  --surface-hot: #FBEFE6;   /* note tint, dial strip */
  --hover:       #F4F0E6;

  --ink:   #16130E;  /* 17.61 ground | 15.72 tile | 16.28 hover */
  --ink-2: #2E2820;  /* 13.85 ground | 12.37 tile */
  --muted: #4A4236;  /*  9.40 ground |  8.69 hover */
  --label: #554C3D;  /*  8.02 ground |  7.16 tile |  7.42 hover */
  --alert: #8C2B10;  /*  8.09 ground |  7.53 note |  7.22 tile */
  --live:  #15603A;  /*  7.22 ground | 7.22 reversed */

  --rule:       #8A7B5E;  /* 3.93 ground | 3.51 tile - non-text, needs 3:1 */
  --rule-faint: #D8D0BE;  /* decorative only; no text sits on it */

  /* Latin steps ~1.2. JP runs 2-3px hotter for equal legibility. */
  --t-utter: 32px;  --t-gloss: 28px;
  --t-jp:    20px;  --t-note:  17px;  --t-body: 17px;
  --t-ui:    16px;  --t-find:  15px;  --t-micro: 13px;  /* hard floor */

  --sans:'Atkinson Hyperlegible Next','Atkinson Hyperlegible','Inter',
         -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --jp:'Noto Sans JP','Hiragino Sans','Yu Gothic UI',sans-serif;
}

/* A bookmarks bar costs ~100px and the page is the loser. Below 620px the type
   steps down one notch — never below the 13px floor — and the ranking inside
   each card is preserved: romaji still leads .phrase--self, English still
   leads .phrase--staff. Everything else about the layout is unconditional. */
@media(max-height:620px){
  :root{ --t-utter:26px; --t-gloss:22px; --t-jp:18px; --t-note:15px; }
}

/* Night fallback: <html data-theme="dark">. Same 7:1 floor, all measured. */
[data-theme="dark"]{
  --ground:#111010; --surface:#1C1A17; --surface-hot:#241A14; --hover:#232019;
  --ink:#F5F1E8;   /* 16.85 ground | 15.40 tile */
  --ink-2:#D8D0C2; /* 12.41 ground */
  --muted:#B6AB96; /*  8.37 ground |  7.65 tile */
  --label:#B6AB96; /*  7.65 tile - no dimmer tier clears 7:1 on tiles */
  --alert:#F5A868; /*  9.66 ground |  8.67 note */
  --live:#6FD49A;  /* 10.46 ground */
  --rule:#7A6E5C;  /*  3.81 */
  --rule-faint:#33302A;
  -webkit-font-smoothing:antialiased;
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

body{font-family:var(--sans);font-size:var(--t-body);line-height:1.45;
  background:var(--ground);color:var(--ink);height:100dvh;overflow:hidden;
  display:flex;flex-direction:column;font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:inherit;-webkit-appearance:none;appearance:none;
  cursor:pointer;background:none;border:none;color:inherit}
h2,h3{font-weight:600}

/* Focus was entirely absent. He may be tabbing one-handed. */
:where(a,button,input,[tabindex]):focus-visible{
  outline:3px solid var(--live);outline-offset:2px;border-radius:2px}

/* ---------------- header fact card ---------------- */
/* Each fact was a 45px stack (key over value); eight of them wrapped to three
   rows. Read inline as "KEY value" they are ~20px lines, and the whole card
   is one strip. Nothing was deleted - see .card__fact--prep below. */
.card{display:flex;flex-wrap:wrap;gap:0 16px;align-items:center;padding:3px 14px;
  border-bottom:2px solid var(--rule);background:var(--surface)}
.card__fact{display:flex;align-items:baseline;gap:6px;line-height:1.3}
.card__key{font-size:var(--t-micro);font-weight:600;letter-spacing:.07em;
  text-transform:uppercase;color:var(--label)}            /* was 9px @ 3.06:1 */
.card__val{font-size:16px;font-weight:600;color:var(--ink)}
.card__val--jp{font-family:var(--jp);font-size:16px;font-weight:500}
.card__val--warn{color:var(--alert)}
.card__mic{margin-left:auto;display:flex;align-items:center;gap:8px}

/* Three of the eight facts answer questions he cannot be asked once the line
   is open: which restaurant he dialled, the number he dialled, and a fee that
   only matters if he cancels later. On a short screen they yield the row.
   They stay in the DOM, stay on the printout, and come back above 620px.

   The five that remain drop their KEY labels there too, because the values are
   self-describing -- "Tue 3 Nov 2026", "19:00", "+62 812 8063 7730" need no
   caption - and the captions were ~80px apiece, which is what forced the card
   onto a second 35px row. Hidden, not removed: still read aloud, still printed. */
@media(max-height:620px){
  .card__fact--prep{display:none}
  .dial{display:none}
  .card{gap:0 18px}
  .card__key{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;
    clip-path:inset(50%);white-space:nowrap}
  #print-btn{display:none}
}

#mic-toggle,#print-btn,#composer-go,#key-set,#start-call,#composer-toggle{
  border:2px solid var(--rule);border-radius:3px;padding:4px 11px;
  font-size:var(--t-find);font-weight:600;letter-spacing:.03em;color:var(--ink);
  min-height:28px}
#start-call,#mic-toggle{min-height:29px;font-size:var(--t-ui);padding:3px 13px}
#mic-toggle[data-on="true"]{background:var(--live);border-color:var(--live);
  color:var(--ground)}                                     /* 7.22:1 reversed */
#mic-toggle:disabled{opacity:.55;cursor:not-allowed}
#composer-toggle kbd{font:inherit;border:1px solid var(--rule);border-radius:2px;
  padding:0 4px;margin-left:3px}
#mic-status{font-size:var(--t-micro);font-weight:600;color:var(--label);
  max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------------- pre-call briefing ---------------- */
.dial{padding:5px 14px;background:var(--surface-hot);
  border-bottom:1px solid var(--rule-faint);font-size:var(--t-find);
  line-height:1.35;color:var(--alert)}
.dial strong{font-weight:700;color:var(--ink)}

/* ---------------- panels ---------------- */
main{flex:1;min-height:0;display:flex;flex-direction:column;
  gap:2px;background:var(--rule)}
.panel{background:var(--ground);padding:6px 14px}
/* Reserved height, still. The radar is silent by design most of the time and a
   box that resized on every utterance would shift the script under his eyes -
   so its height is a pure function of the VIEWPORT and never of its contents.
   What changed is the size of the reservation: 190px unconditionally (40% of a
   short screen) became 18vh, floored at 84px and capped at 150px. It overflows
   internally instead of pushing. */
#radar-panel{flex:0 0 auto;height:clamp(84px,18vh,150px);overflow-y:auto;
  overscroll-behavior:contain}
#script-panel{flex:1;min-height:0;overflow-y:auto;padding-bottom:14px}
.panel__label{font-size:var(--t-micro);font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--label);margin-bottom:6px}

/* Screen-hidden, paper-visible. */
.print-only{display:none}

/* CALL MODE. Once the line is open the eight header facts are answering
   questions he cannot be asked: date, time, party, name and phone are each
   printed inside the very phrase card he reads them from (self-datetime,
   self-party, self-name, self-phone-digits), and the restaurant and dial number
   are behind him. What survives is the control cluster - End call, Listen, its
   status, and the composer key - because those he still needs. */
body[data-mode="call"] .dial,
body[data-mode="call"] .card__fact,
body[data-mode="call"] #print-btn{display:none}
body[data-mode="call"] .card{padding:2px 14px}

/* The reservation narrows to the band. The detail underneath is prep-time
   material; on the call the script below is what he acts on, and setStage()
   has already walked it to the right stage. */
body[data-mode="call"] #radar-panel{height:clamp(56px,12vh,84px);overflow:hidden}
body[data-mode="call"] #radar > :not(.radar__band){display:none}

/* The tiles were advertising a mechanism TTS already provides: he presses 1-5
   and the laptop speaks it. On the call they collapse to a keymap - numeral
   plus finder label, one line. The full tiles stay in PREP, where he learns
   the mapping. */
body[data-mode="call"] .panic__btn{flex-direction:row;align-items:center;gap:9px;
  padding:4px 10px;min-height:30px}
body[data-mode="call"] .panic__romaji{display:none}
body[data-mode="call"] .panic__key{position:static;font-size:var(--t-ui);
  font-weight:700;color:var(--ink)}
body[data-mode="call"] #start-call{background:var(--alert);color:var(--ground);
  border-color:var(--alert)}

/* ---------------- stage bar (navigation) ---------------- */
/* Every stage named in full, in readable type, numbered, and under each name
   the words the staff say when that stage starts: he hears 何名様 and clicks
   "3 Party size". It was 13px uppercase cut to "PARTY SI…", and said nothing
   about when to use it. One row, each name and cue on one line: where the
   column is too narrow for all nine (call mode, beside the transcript) the
   row scrolls sideways and setStage() keeps the current stage in view -
   squeezing nine boxes into 850px wrapped them to four lines each. */
#stepper{flex:0 0 auto;display:flex;flex-wrap:nowrap;gap:4px;padding:5px 12px;align-items:stretch;
  background:var(--surface);border-bottom:1px solid var(--rule);
  overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin;scroll-padding-inline:12px}
.step{flex:1 0 auto;white-space:nowrap;display:flex;flex-direction:column;justify-content:flex-start;
  gap:1px;padding:4px 8px 5px;text-align:left;border:1px solid var(--rule-faint);
  border-bottom:3px solid var(--rule-faint);border-radius:6px;background:var(--ground)}
.step__name{font-size:var(--t-find);font-weight:700;line-height:1.15;color:var(--ink-2)}
.step__cue{font-family:var(--jp);font-size:var(--t-micro);font-weight:500;line-height:1.25;
  color:var(--muted);overflow-wrap:anywhere}                     /* 9.40:1 */
.step:hover{background:var(--hover);border-color:var(--rule)}
.step:hover .step__name{color:var(--ink)}
.step[data-current="true"]{background:var(--surface-hot);border-color:var(--alert)}
.step[data-current="true"] .step__name{color:var(--ink)}
.step[data-current="true"] .step__cue{color:var(--alert)}        /* 7.53:1 */
#stepper-hint{flex:0 0 auto;font-size:var(--t-micro);color:var(--label);margin-left:6px;
  align-self:center;max-width:6.5em;line-height:1.25}
@media(max-width:1100px){#stepper-hint{display:none}}

/* The accordion is gone (setStage shows exactly one section); .stage__label,
   .stage__count and .stage__body went with it, and their rules went too -
   including the print rules that were still targeting them. */
.stage{margin-bottom:0}

/* ================= phrase card: shared shell ================= */
/* Every millimetre here is a millimetre of script. The card keeps its full
   ranking; only the dead air between the lines was spent. */
.phrase{position:relative;display:flex;flex-direction:column;
  padding:6px 46px 7px 12px;border-bottom:1px solid var(--rule-faint);
  border-left:4px solid var(--rule-faint)}
.phrase:hover,.phrase:focus-within{border-left-color:var(--live);background:var(--hover)}
/* The interpreter's pick for what he says next. Colour AND weight, so it reads
   at a glance without relying on hue alone. */
.phrase[data-suggested="true"]{border-left:8px solid var(--live);background:var(--hover);
  outline:2px solid var(--live);outline-offset:-2px}
.panic__btn[data-suggested="true"]{outline:3px solid var(--live);outline-offset:-3px}
/* Written by Claude for a moment his script does not cover. Say so on the card:
   it has not been through the same hand audit as the rest of the script. */
.phrase--custom::before{content:'Written for you by Claude — not in your script';order:0;
  font-size:var(--t-micro);font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--live);margin-bottom:2px}

.phrase__speak{position:absolute;top:6px;right:4px;width:36px;height:36px;
  border:2px solid var(--rule);border-radius:50%;font-size:14px;color:var(--ink-2)}
.phrase__speak:hover{border-color:var(--live);background:var(--live);color:var(--ground)}

/* The note is the highest-value content in the project. Set it LARGER than the
   gloss and the kanji, on its own tint. It was 11px. */
.phrase__note{order:5;font-size:var(--t-note);font-weight:600;line-height:1.3;
  color:var(--alert);background:var(--surface-hot);margin-top:5px;
  border-left:4px solid var(--alert);padding:4px 8px}           /* 7.53:1 */

/* ---- SPEAKING. DOM order is kanji,kana,romaji,en,note -> reordered here. ---- */
.phrase--self .phrase__en{order:1;font-size:var(--t-find);font-weight:600;
  line-height:1.15;color:var(--label);margin-bottom:1px}
.phrase--self .phrase__romaji{order:2;font-size:var(--t-utter);font-weight:700;
  font-style:normal;line-height:1.12;letter-spacing:.005em;color:var(--ink)}
.phrase--self .phrase__kanji{order:3;font-family:var(--jp);font-size:var(--t-jp);
  font-weight:500;line-height:1.3;color:var(--ink-2);margin-top:2px}
.phrase--self .phrase__kana{order:4;font-family:var(--jp);font-size:var(--t-find);
  font-weight:400;line-height:1.35;color:var(--muted);margin-top:1px}
/* Kana is the one line in the card with no reader: he says the romaji, the
   play button speaks the kana, and the kanji is what the staff would see.
   It is the first thing to go when the screen is short. It survives on a tall
   screen and on paper. */
@media(max-height:620px){ #script-panel .phrase__kana{display:none} }

/* ---- LISTENING. Romaji and kana suppressed: he never speaks these. ---- */
.phrase--staff .phrase__en{order:1;font-size:var(--t-gloss);font-weight:600;
  line-height:1.15;color:var(--ink)}
.phrase--staff .phrase__kanji{order:2;font-family:var(--jp);font-size:17px;
  font-weight:400;line-height:1.35;color:var(--muted);margin-top:4px}
.phrase--staff .phrase__romaji,
.phrase--staff .phrase__kana{display:none}

/* renderFallbackResult() hardcodes who:'staff', but a composer result is a line
   HE says. Restore the speaking scale. (The real fix is one line in ui.js.) */
#composer-out .phrase .phrase__romaji{display:block;order:2;font-size:var(--t-utter);
  font-weight:700;font-style:normal;line-height:1.2;color:var(--ink)}
#composer-out .phrase .phrase__kana{display:block;order:4;font-family:var(--jp);
  font-size:var(--t-find);color:var(--muted)}
#composer-out .phrase .phrase__en{order:1;font-size:var(--t-find);font-weight:600;
  color:var(--label);margin-bottom:5px}
#composer-out .phrase .phrase__kanji{order:3;font-size:var(--t-jp);
  color:var(--ink-2);margin-top:7px}

/* ---------------- radar ---------------- */
.radar__sublabel{font-size:var(--t-micro);font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--label);margin:0 0 2px}
.radar__heard{border-left:4px solid var(--rule);padding-left:12px;margin-bottom:6px}
.radar__transcript{font-family:var(--jp);font-size:19px;font-weight:500;
  line-height:1.3;color:var(--ink-2)}
.radar__idle{font-size:var(--t-find);color:var(--label)}
.radar__nomatch{font-size:var(--t-note);font-weight:600;color:var(--alert);padding:4px 0}
.radar__lowconf{font-size:var(--t-find);font-weight:500;font-style:normal;
  color:var(--label);padding:3px 0}                       /* was 11px @ 3.06:1 */
.radar__alt{font-family:var(--jp);font-size:18px;color:var(--muted);padding:4px 0}
.radar__replies .phrase{border-left:4px solid var(--live);padding-left:12px}
.radar__fallback{border:2px solid var(--alert);border-radius:3px;padding:5px 12px;
  font-size:var(--t-find);font-weight:600;color:var(--alert);margin-top:4px;min-height:30px}
.radar__fallback:hover{background:var(--alert);color:var(--ground)}

/* The band: one row, always populated, sized by the viewport and never by its
   contents. The label carries the state as colour as well as words. */
.radar__band{display:flex;align-items:baseline;gap:10px}
.radar__band-label{flex:0 0 auto;font-size:var(--t-micro);font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;color:var(--label)}
.radar__band--hit .radar__band-label{color:var(--live)}   /* 7.22:1 */
.radar__band--miss .radar__band-label{color:var(--alert)} /* 8.09:1 */
.radar__band-text{min-width:0;font-size:var(--t-gloss);font-weight:600;
  line-height:1.2;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.radar__band-text--jp{font-family:var(--jp);font-size:18px;font-weight:500;color:var(--ink-2)}
.radar__band-text--stage{font-size:var(--t-ui);font-weight:600;color:var(--label)}
.radar__band .radar__fallback{flex:0 0 auto;margin:0 0 0 auto;align-self:center}

/* Cards inside the reservation are tighter than cards in the script, because
   the reservation cannot grow. The staff line's English still leads. */
#radar-panel .phrase{padding:0 40px 2px 10px;border-bottom:none;border-left-width:0}
#radar-panel .phrase__speak{top:0;right:2px;width:32px;height:32px}
@media(max-height:620px){
  #radar-panel .phrase--staff .phrase__kanji{display:none}
  #radar-panel .phrase__kana{display:none}
}

/* ---------------- composer ---------------- */
/* The composer is a tool he reaches for, not an instrument he monitors, so it
   costs zero rows until he asks for it (button, or "t"). As an overlay it is
   now available DURING the call too, which the old flow layout made impossible. */
#composer{position:fixed;left:0;right:0;bottom:0;z-index:20;display:none;
  border-top:2px solid var(--rule);padding:10px 14px;
  flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);
  box-shadow:0 -10px 30px rgba(0,0,0,.20)}
body[data-composer="open"] #composer{display:flex}
#composer-input{flex:1;min-width:220px;background:var(--ground);border:2px solid var(--rule);
  color:var(--ink);padding:8px 12px;font-size:var(--t-body);border-radius:3px;min-height:38px}
#composer-input::placeholder{color:var(--label);opacity:1}
#composer-out{flex-basis:100%;max-height:38vh;overflow-y:auto}

/* ---------------- panic bar: the most important control ---------------- */
/* Each tile stacked English + romaji + kanji in a 1/5-width column and wrapped,
   which is how five buttons became 230px. The kanji goes (he is not reading it
   to say it - he presses 1-5 and the laptop speaks the kana, or he reads the
   romaji); English drops to the finder line; romaji is clamped to two lines.
   Five tiles, one row, ~62px. Kanji returns on the printout. */
#panic{flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);
  gap:1px;background:var(--rule);border-top:2px solid var(--rule)}
.panic__btn{background:var(--surface);min-width:0;padding:3px 26px 4px 10px;
  text-align:left;display:flex;flex-direction:column;gap:0;position:relative}
.panic__btn:focus-visible{outline:3px solid var(--alert);outline-offset:-3px}
.panic__key{position:absolute;top:4px;right:8px;font-size:var(--t-micro);
  font-weight:700;color:var(--label)}
.panic__btn:hover{background:var(--ground)}
.panic__en{order:1;min-width:0;font-size:var(--t-micro);font-weight:700;
  color:var(--label);line-height:1.2;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}                                /* was 9px @ 2.95:1 */
.panic__romaji{order:2;font-size:var(--t-find);font-weight:700;font-style:normal;
  line-height:1.2;color:var(--ink);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.panic__kanji{display:none}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------------- paper fallback; now matches the screen ---------------- */
@media print{
  :root{--ground:#fff;--surface:#fff;--surface-hot:#fff;--hover:#fff;--ink:#000;
    --ink-2:#000;--muted:#333;--label:#444;--alert:#000;--rule:#000;--rule-faint:#bbb}
  body{background:#fff;color:#000;display:block;font-size:11pt}
  .card__mic,.dial,#composer,#mic-toggle,#print-btn,.phrase__speak,
  #radar-panel,#stepper,.panel__label{display:none!important}
  main{display:block;overflow:visible}
  .panel{overflow:visible;padding:0;height:auto!important}
  /* Screen hides eight of nine stages (setStage sets [hidden]) and hides the
     prep facts and kana on a short screen. Paper wants all of it. */
  .stage[hidden]{display:block!important}
  .card__fact--prep{display:flex!important}
  /* Paper is never a "short screen": undo the short-viewport suppressions
     explicitly rather than relying on the print page box being over 620px. */
  .card__key{position:static!important;width:auto!important;height:auto!important;
    clip-path:none!important}
  .phrase__kana{display:block!important}
  /* Staff lines on paper: English still leads (11.5pt vs 10pt kanji), but the
     romaji comes back, because on paper the job is matching a sound he just
     heard to a line, and he cannot do that from kanji. */
  .phrase--staff .phrase__en{font-size:11.5pt;font-weight:700;color:#000}
  .phrase--staff .phrase__kanji{display:block!important;order:2;font-size:10pt;margin-top:1pt}
  .phrase--staff .phrase__romaji{display:block!important;order:3;font-size:9.5pt;
    font-style:normal;font-weight:400;color:#333}
  .phrase--staff .phrase__kana{order:4;font-size:8.5pt;color:#333}
  .card{border-bottom:1.5pt solid #000;padding:0 0 8pt;margin-bottom:10pt;background:none}
  .card__key{font-size:7.5pt;color:#444}
  .card__val,.card__val--jp{font-size:11pt}
  .print-only{display:block}
  .stage{border-bottom:1pt solid #bbb;margin-bottom:6pt}
  .stage__heading,.sheet__heading{font-size:12.5pt;font-weight:700;color:#000;
    padding:8pt 0 3pt;break-after:avoid}
  .sheet__heading{font-size:14pt;border-top:1.5pt solid #000;margin-top:14pt;
    break-before:page}
  .phrase{border-bottom:.5pt dotted #bbb;padding:4pt 0;break-inside:avoid;border-left:none}
  .phrase--self .phrase__en{font-size:9.5pt;font-weight:700}
  .phrase--self .phrase__romaji{font-size:14pt;font-weight:700}
  .phrase--self .phrase__kanji{font-size:12pt;margin-top:2pt}
  .phrase--self .phrase__kana{font-size:9pt;color:#333}
  .phrase__note{font-size:9.5pt;background:none;border-left:1.5pt solid #000;padding:2pt 0 2pt 6pt}
  #panic{display:block;border-top:1.5pt solid #000;margin-top:10pt;padding-top:6pt;background:none}
  .panic__btn{background:none;display:inline-block;width:48%;padding:3pt 0;vertical-align:top}
  .panic__en{font-size:8pt;white-space:normal}
  .panic__romaji{font-size:12pt;display:block;-webkit-line-clamp:none;overflow:visible}
  .panic__kanji{display:block!important;font-size:10pt}

  /* Three notes in the library tell him to write something down - the staff
     member's name, the confirmation mail, the callback - and there was nowhere
     to write it. Ruled blanks, because this sheet is next to the phone. */
  #writedown{break-inside:avoid;margin-top:14pt}
  .blank{display:flex;align-items:baseline;gap:8pt;padding:7pt 0 2pt}
  .blank dt{flex:0 0 130pt;font-size:9.5pt;font-weight:700}
  .blank dd{flex:1;border-bottom:.75pt solid #000;min-height:15pt}
}

/* ---------------- rehearsal ---------------- */
#rehearse-bar{display:none;flex:0 0 auto;align-items:center;gap:8px;padding:6px 14px;
  background:var(--surface);border-bottom:1px solid var(--rule)}
body[data-rehearse="on"] #rehearse-bar{display:flex}
body[data-rehearse="on"] #start-call,
body[data-rehearse="on"] #rehearse-btn,
body[data-rehearse="on"] #mic-toggle,
body[data-rehearse="on"] #mic-status{display:none}
.rh__status{flex:0 0 auto;min-width:9.5em;text-align:center;font-size:var(--t-micro);
  font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:8px 10px;
  border-radius:3px;color:var(--label);border:1px solid var(--rule)}
.rh__status[data-state="you"]{color:var(--ground);background:var(--live);border-color:var(--live)}
.rh__status[data-state="staff"]{color:var(--ground);background:var(--ink-2);border-color:var(--ink-2)}
#rh-input{flex:1;min-width:120px;min-height:44px;font-family:var(--jp);font-size:18px;
  padding:6px 10px;background:var(--ground);color:var(--ink);
  border:1px solid var(--rule);border-radius:3px}
#rehearse-bar button{min-height:44px;padding:6px 12px;border:1px solid var(--rule);
  border-radius:3px;font-size:var(--t-ui);font-weight:600;color:var(--ink);
  background:var(--ground);white-space:nowrap}
#rehearse-bar kbd{font-family:inherit;font-size:var(--t-micro);color:var(--label)}
.rh__toggle{display:flex;align-items:center;gap:6px;font-size:var(--t-micro);
  color:var(--label);white-space:nowrap;min-height:44px}
body[data-rehearse="on"][data-radar="hidden"] #radar{visibility:hidden}

#debrief{display:none;position:fixed;inset:0;z-index:30;background:var(--ground);
  overflow-y:auto;padding:24px clamp(16px,6vw,72px)}
body[data-debrief="open"] #debrief{display:block}
.debrief__title{font-size:26px;margin-bottom:6px;color:var(--ink)}
.debrief__summary{font-size:var(--t-body);color:var(--ink-2);margin-bottom:18px}
.debrief__list{list-style:none;display:flex;flex-direction:column;gap:10px;max-width:60rem}
.debrief__turn{padding:10px 14px;border-left:4px solid var(--rule);background:var(--surface)}
.debrief__turn--you{border-left-color:var(--live);background:var(--ground)}
.debrief__who{font-size:var(--t-micro);font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;color:var(--label)}
.debrief__ja{font-family:var(--jp);font-size:20px;color:var(--ink);margin-top:2px}
.debrief__en{font-size:var(--t-body);color:var(--ink-2);margin-top:2px}
.debrief__radar{font-size:var(--t-micro);font-weight:700;margin-top:4px}
.debrief__radar--hit{color:var(--live)}
.debrief__radar--miss{color:var(--alert)}
.debrief__actions{display:flex;gap:10px;margin-top:20px}
.debrief__actions button{min-height:44px;padding:8px 18px;border:1px solid var(--rule);
  border-radius:3px;font-size:var(--t-ui);font-weight:600}
#debrief-again{background:var(--ink);color:var(--ground);border-color:var(--ink)}
@media print{#rehearse-bar,#debrief{display:none!important}}
#rh-scenario{min-height:44px;padding:6px 10px;border:1px solid var(--rule);border-radius:3px;
  font-size:var(--t-micro);font-weight:600;color:var(--ink);background:var(--ground)}
body[data-rehearse="on"] #rh-scenario,
body[data-mode="call"] #rh-scenario{display:none}
@media print{#rh-scenario{display:none!important}}
#facts{display:contents}
#restaurant-pick{min-height:44px;padding:6px 10px;border:2px solid var(--ink);border-radius:3px;
  font-size:var(--t-ui);font-weight:700;color:var(--ink);background:var(--ground)}
body[data-mode="call"] #restaurant-pick,
body[data-rehearse="on"] #restaurant-pick{display:none}
@media print{#restaurant-pick{display:none!important}}
#connect-call{min-height:29px;font-size:var(--t-ui);font-weight:600;padding:3px 13px;
  border:1px solid var(--rule);border-radius:3px;color:var(--ink);background:var(--ground)}
#connect-call[data-on="true"]{background:var(--live);border-color:var(--live);color:var(--ground)}
body[data-rehearse="on"] #connect-call{display:none}
@media print{#connect-call{display:none!important}}

/* ── Transcript: every line stays on screen ─────────────────────────────── */
#history-panel{display:none;position:relative;min-height:0;background:var(--ground);
  border-left:2px solid var(--rule)}
body[data-mode="call"] main,
main[data-has-history="true"]{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);
  grid-template-rows:auto auto minmax(0,1fr)}
body[data-mode="call"] #radar-panel,
main[data-has-history="true"] #radar-panel{grid-column:1;grid-row:1}
body[data-mode="call"] #stepper,
main[data-has-history="true"] #stepper{grid-column:1;grid-row:2}
body[data-mode="call"] #script-panel,
main[data-has-history="true"] #script-panel{grid-column:1;grid-row:3}
body[data-mode="call"] #history-panel,
main[data-has-history="true"] #history-panel{display:block;grid-column:2;grid-row:1 / 4}
/* The one-line band is what failed him: the transcript replaces it mid-call. */
body[data-mode="call"] #radar-panel{display:none}
#history-list{list-style:none;height:100%;overflow-y:auto;padding:8px 14px 56px;
  overscroll-behavior:contain}
#history-list:empty::before{content:'What they say appears here — and stays.';
  display:block;padding:10px 0;font-size:var(--t-ui);color:var(--label)}
.turn{padding:9px 0 9px 10px;border-bottom:1px solid var(--rule-faint);border-left:3px solid transparent}
.turn--live{border-left-color:var(--live)}
.turn__who{display:block;font-size:var(--t-micro);font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--label)}
.turn__who:empty{display:none}
.turn__en{font-size:20px;font-weight:600;line-height:1.3;color:var(--ink)}
.turn__en:empty{display:none}
.turn--staff .turn__en:empty{display:block}
.turn--staff .turn__en:empty::before{content:'translating…';font-size:var(--t-ui);
  font-weight:400;color:var(--label)}
.turn__ja{font-family:var(--jp);font-size:17px;line-height:1.45;color:var(--ink-2);margin-top:3px}
.turn--you{background:var(--surface)}
.turn--you .turn__ja{color:var(--ink-2)}
.history__jump{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);
  min-height:40px;padding:6px 16px;border-radius:20px;border:2px solid var(--ink);
  background:var(--ink);color:var(--ground);font-size:var(--t-ui);font-weight:700;
  box-shadow:0 2px 8px rgba(0,0,0,.25)}
@media(max-width:760px){
  body[data-mode="call"] main,main[data-has-history="true"]{grid-template-columns:1fr;
    grid-template-rows:minmax(0,38%) auto minmax(0,1fr)}
  body[data-mode="call"] #history-panel,main[data-has-history="true"] #history-panel{
    grid-column:1;grid-row:1;border-left:none;border-bottom:2px solid var(--rule)}
  body[data-mode="call"] #stepper,main[data-has-history="true"] #stepper{grid-row:2}
  body[data-mode="call"] #script-panel,main[data-has-history="true"] #script-panel{grid-row:3}
}
@media print{#history-panel{display:none!important}}
#api-alert{flex:0 0 auto;padding:10px 16px;background:var(--alert);color:var(--ground);
  font-size:var(--t-body);font-weight:700;line-height:1.35}
@media print{#api-alert{display:none!important}}

/* ── Past calls: every session saved, reread any time ───────────────────── */
#past-btn{min-height:29px;font-size:var(--t-ui);font-weight:600;padding:3px 13px;
  border:1px solid var(--rule);border-radius:3px;color:var(--ink);background:var(--ground)}
body[data-mode="call"] #past-btn,body[data-rehearse="on"] #past-btn{display:none}
#past-calls{display:none;position:fixed;inset:0;z-index:30;background:var(--ground);
  overflow-y:auto;padding:18px clamp(16px,6vw,72px) 40px}
body[data-past="open"] #past-calls{display:block}
.past__bar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.past__bar h2{flex:1;font-size:24px;color:var(--ink)}
.past__bar button,.past__item button{min-height:44px;padding:6px 14px;border:1px solid var(--rule);
  border-radius:3px;font-size:var(--t-ui);font-weight:600;color:var(--ink);background:var(--ground)}
.past__list{list-style:none;display:flex;flex-direction:column;gap:8px;max-width:60rem}
.past__item{display:flex;gap:8px;align-items:stretch}
.past__item .past__open{flex:1;text-align:left;background:var(--surface);font-size:var(--t-body)}
.past__item .past__delete{color:var(--alert)}
.past__empty{font-size:var(--t-body);color:var(--label)}
.past__turns{list-style:none;max-width:60rem}
.turn__at{display:inline-block;min-width:3.4em;font-size:var(--t-micro);font-weight:700;color:var(--label)}
@media print{#past-calls,#past-btn{display:none!important}}

/* Readings for everything recognised: kana, then romaji. */
.turn__kana{font-family:var(--jp);font-size:14px;line-height:1.45;color:var(--muted)}
.turn__romaji{font-size:15px;line-height:1.35;color:var(--ink-2)}
.turn__kana:empty,.turn__romaji:empty{display:none}
.debrief__kana{font-family:var(--jp);font-size:15px;color:var(--muted);margin-top:2px}
.debrief__romaji{font-size:15px;color:var(--ink-2);margin-top:1px}
</style>

<body>

<header class="card">
  <div id="facts"></div>
  <div class="card__mic">
    <select id="restaurant-pick" aria-label="Restaurant to call"></select>
    <button id="start-call" type="button">Start call</button>
    <button id="rehearse-btn" type="button">Rehearse</button>
    <select id="rh-scenario" aria-label="Rehearsal scenario"></select>
    <button id="composer-toggle" type="button" aria-expanded="false"
            aria-controls="composer">Ask Claude <kbd>/</kbd></button>
    <button id="past-btn" type="button">Past calls</button>
    <button id="print-btn" type="button">Print</button>
    <button id="connect-call" type="button" data-on="false"
            title="Listen to the Yolla tab directly — for calls with earphones">Connect call</button>
    <button id="mic-toggle" type="button" data-on="false">Listen</button>
    <span id="mic-status">idle</span>
  </div>
</header>

<!-- Rehearsal only: Claude plays the staff, speaks each line aloud, and listens
     for the reply. Hidden unless body[data-rehearse="on"]. -->
<div id="api-alert" role="alert" hidden></div>

<section id="rehearse-bar" aria-live="polite">
  <span id="rh-status" class="rh__status" data-state="idle">—</span>
  <input id="rh-input" type="text" autocomplete="off" spellcheck="false"
         placeholder="Speak your reply — or type it">
  <button id="rh-send" type="button">Send <kbd>↵</kbd></button>
  <button id="rh-repeat" type="button">Repeat</button>
  <button id="rh-slow" type="button">Slower</button>
  <label class="rh__toggle"><input id="rh-hide-radar" type="checkbox"> Hide radar</label>
  <button id="rh-end" type="button">End</button>
</section>

<div class="dial" id="call-window"></div>

<main>
  <section class="panel" id="radar-panel">
    <div id="radar"></div>
  </section>
  <nav id="stepper"></nav>
  <section class="panel" id="script-panel">
    <div id="script"></div>
  </section>
  <aside id="history-panel" aria-label="What was said">
    <ol id="history-list"></ol>
    <button id="history-jump" class="history__jump" type="button" hidden>New lines ↓</button>
  </aside>
</main>

<section id="composer">
  <input id="composer-input" type="text" placeholder="Say something else — type English…">
  <button id="composer-go" type="button">Translate</button>
  <button id="key-set" type="button">API key</button>
  <div id="composer-out"></div>
</section>

<footer id="panic"></footer>

<!-- Paper only. The screen never lays these out; they cost nothing until Cmd-P. -->
<section id="staff-sheet" class="print-only"></section>

<section id="writedown" class="print-only">
  <h2 class="sheet__heading">Write it down</h2>
  <dl>
    <div class="blank"><dt>Who you spoke to</dt><dd></dd></div>
    <div class="blank"><dt>Time confirmed</dt><dd></dd></div>
    <div class="blank"><dt>Email read back as</dt><dd></dd></div>
    <div class="blank"><dt>Call back at (WIB / Tokyo)</dt><dd></dd></div>
  </dl>
</section>

<section id="past-calls" role="dialog" aria-modal="true" aria-labelledby="past-title">
  <div class="past__bar">
    <button id="past-back" type="button" hidden>← All calls</button>
    <h2 id="past-title">Past calls</h2>
    <button id="past-close" type="button">Close</button>
  </div>
  <div id="past-body"></div>
</section>

<section id="debrief" role="dialog" aria-modal="true" aria-label="Rehearsal debrief">
  <div id="debrief-body"></div>
  <div class="debrief__actions">
    <button id="debrief-again" type="button">Rehearse again</button>
    <button id="debrief-close" type="button">Close</button>
  </div>
</section>

<!-- Pins every call/*.js to one deploy's version, so a module cached from the

<script type="importmap">
{

<script type="module">
  import { renderScript, renderPanic, renderRadar, renderFallbackResult,
           renderStaffSheet, setStage, nextStage, prevStage, stageIndexOfPhrase,
           speakPanic, renderDebrief, renderBand, markSuggested } from './call/ui.js';
  import { interpret, isOwnLine, repliesWithItself, readJapanese } from './call/interpret.js';
  import { RESTAURANT, RESTAURANTS } from './call/restaurants.js';
  import { createStaffSim, scoreRadar, scenariosFor } from './call/staff-sim.js';
  import { createRehearsal } from './call/rehearse.js';
  import { createHistory } from './call/history.js';
  import { startSession, saveSession, loadSessions, deleteSession, sessionToText, describeSession } from './call/sessions.js';
  import { match } from './call/match.js';
  import { PANIC, STAFF } from './call/phrases.js';
  import { initVoices, setSpeechGate, speak } from './call/speak.js';
  import { createListener, isSecureForMic } from './call/listen.js';
  import { composeEnglish, translateJapanese, hasKey, setKey, callClaude, streamClaude, checkApi } from './call/fallback.js';

  const radarRoot = document.getElementById('radar');
  const toggle = document.getElementById('mic-toggle');
  const status = document.getElementById('mic-status');
  const out = document.getElementById('composer-out');
  const input = document.getElementById('composer-input');
  const setStatus = text => { status.textContent = text; };

  // ── The restaurant being called ─────────────────────────────────────────
  document.title = `${RESTAURANT.name.short} — Call Assistant`;
  const factsRoot = document.getElementById('facts');
  const [partyFact, ...extraFacts] = RESTAURANT.headerFacts;
  const facts = [
    { key: 'Restaurant', value: `${RESTAURANT.name.ja} (${RESTAURANT.name.en})`, jp: true, prep: true },
    { key: 'Dial', value: RESTAURANT.dial, prep: true },
    { key: 'Date', value: RESTAURANT.date.header },
    { key: 'Time', value: RESTAURANT.time.header },
    partyFact,
    { key: 'Name', value: 'ジェフリー (Jefurī)', jp: true },
    { key: 'Your phone', value: '+62 812 8063 7730' },
    ...extraFacts.map(f => ({ ...f, prep: true })),
  ];
  for (const f of facts) {
    const fact = document.createElement('div');
    fact.className = 'card__fact' + (f.prep ? ' card__fact--prep' : '');
    const key = Object.assign(document.createElement('span'), { className: 'card__key', textContent: f.key });
    const val = Object.assign(document.createElement('span'), { textContent: f.value,
      className: 'card__val' + (f.jp ? ' card__val--jp' : '') + (f.warn ? ' card__val--warn' : '') });
    fact.append(key, val);
    factsRoot.append(fact);
  }
  const callWindow = document.getElementById('call-window');
  callWindow.append(Object.assign(document.createElement('strong'), { textContent: RESTAURANT.callWindow.strong }),
                    document.createTextNode(RESTAURANT.callWindow.rest));

  const restaurantPick = document.getElementById('restaurant-pick');
  for (const r of Object.values(RESTAURANTS)) restaurantPick.append(new Option(r.label, r.id));
  restaurantPick.value = RESTAURANT.id;
  // A reload, not a live swap: every module builds its phrases and prompts
  // for one restaurant as it loads, so nothing can go stale mid-call.
  restaurantPick.addEventListener('change', () => { location.search = `?r=${restaurantPick.value}`; });

  const mainEl = document.querySelector('main');
  const history = createHistory(document.getElementById('history-list'), {
    jumpButton: document.getElementById('history-jump'),
    onChange: size => { mainEl.dataset.hasHistory = String(size > 0); scheduleSave(); },
  });

  // ── Every call and rehearsal is saved as it happens ─────────────────────
  let session = null;
  let saveTimer = null;
  function saveNow() {
    clearTimeout(saveTimer);
    if (!session) return;
    session.rows = history.snapshot(session.startedAt);
    saveSession(session);
  }
  function scheduleSave() {
    if (!session) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveNow, 500);
  }
  function beginSession(kind) { session = startSession({ restaurant: RESTAURANT, kind }); }
  function endSession() {
    if (!session) return;
    session.endedAt = Date.now();
    saveNow();
    session = null;
  }
  // Closing the tab mid-call keeps everything said so far.
  addEventListener('pagehide', saveNow);
  setInterval(() => history.closeStale(10_000, 'Unclear — ask them to repeat (press 1)'), 2000);

  // ── When translation cannot work, say so where he is looking ───────────────
  const apiAlert = document.getElementById('api-alert');
  function reportApiError(error, where) {
    setStatus(`${where}: ${error.message}`);
    if (!error.fatal) return;
    apiAlert.textContent = `Translation is OFF — ${error.message.replace(/\.?$/, '.')} `
      + 'Fix it at console.anthropic.com (Plans & Billing), then reload this page.';
    apiAlert.hidden = false;
  }
  async function preflight() {
    if (!hasKey()) return;
    try { await checkApi(); apiAlert.hidden = true; }
    catch (error) { reportApiError(error, 'translator check'); }
  }

  initVoices();
  renderScript(document.getElementById('script'), document.getElementById('stepper'));
  renderPanic(document.getElementById('panic'), { onPick: index => sayPanic(index) });
  renderRadar(radarRoot, { confident: false, candidates: [] }, { transcript: '', isFinal: false });
  renderStaffSheet(document.getElementById('staff-sheet'));
  document.getElementById('print-btn').addEventListener('click', () => window.print());

  // The composer is an overlay now, so it costs no vertical space until asked
  // for -- and it is reachable during the call, which the old flow layout
  // could not do (it was display:none in call mode).
  const composerToggle = document.getElementById('composer-toggle');
  function setComposer(open) {
    document.body.dataset.composer = open ? 'open' : 'closed';
    composerToggle.setAttribute('aria-expanded', String(open));
    if (open) input.focus(); else composerToggle.focus();
  }
  composerToggle.addEventListener('click', () => {
    setComposer(document.body.dataset.composer !== 'open');
  });

  async function askClaude(japanese, into) {
    if (!hasKey()) { into.append(note('Set an API key first.')); return; }
    const pending = note('Asking Claude…');
    into.append(pending);
    try { renderFallbackResult(into, await translateJapanese(japanese)); }
    catch (error) { pending.textContent = error.message; }
  }

  function note(text) {
    const p = document.createElement('p');
    p.className = 'radar__nomatch';
    p.textContent = text;
    return p;
  }

  // ── Live interpreter ───────────────────────────────────────────────────────
  // Every final transcript goes to Claude (call/interpret.js): English in the
  // band from Sonnet in ~1s, a first card from Opus 5 in ~1.5s, and Opus 5.5's
  // final verdict in ~3s. Without a key the library radar below still runs,
  // exactly as before.
  const recent = [];                 // the call so far: { who, ja, english, finalized }
  const interpreted = new Map();     // transcript -> { english, replyId }, for the debrief

  function showIdleBand() {
    renderRadar(radarRoot, { confident: false, candidates: [] }, { transcript: '', isFinal: false });
  }
  function latestStaff() {
    for (let i = recent.length - 1; i >= 0; i -= 1) {
      if (recent[i].who === 'staff' && recent[i].english) return recent[i];
    }
    return null;
  }
  function showStaff(entry) {
    if (entry?.english) renderBand(radarRoot, { label: 'They said', text: entry.english });
    else if (entry) renderBand(radarRoot, { label: 'Heard', text: entry.ja, tone: 'miss', jp: true });
    else showIdleBand();
  }
  // Still the line he is answering? Only a newer STAFF line supersedes it: his
  // own voice, or a line not yet judged, does not.
  function isCurrent(entry) {
    return recent.slice(recent.indexOf(entry) + 1).every(e => e.who !== 'staff');
  }

  // ── Transcribe and translate AS THEY SPEAK (call connected) ──────────────
  // Chrome commits a sentence only after a long silence: measured 1.7-4.6 s
  // after the speaker stopped, on fast keigo through a phone codec - while the
  // words themselves were already recognised, often before the sentence ended.
  // With the call connected the recogniser hears only the staff, so the words
  // are shown the instant they exist and translated as the sentence grows.
  // The finished sentence is then read again, authoritatively.
  // Every new word is translated at once (was: every 8 characters, and the
  // sentence's last few words waited out a 350 ms pause first). Requests are
  // cheap and the account allows 5,000 a minute; the wait was not.
  const EARLY_STABLE_MS = 350;   // words unchanged this long: a natural beat - suggest a card
  // This long and it is usually the end of the sentence: start the authoritative
  // card now (was 700 ms; mid-sentence pauses only cost an unused request). Chrome commits the sentence only 1.7-4.6 s later, and when it does,
  // the answer already in flight is reused (call/interpret.js) instead of asked again.
  const SETTLED_MS = 450;
  let early = null;              // the sentence in progress
  let earlySeq = 0;              // readings requested, in order
  let englishShown = 0;          // newest reading whose English is on screen
  let cardShown = 0;             // newest reading whose card is highlighted
  let cardFinal = false;         // ...and whether that card came from the final verdict
  // Show any answer NEWER than what is on screen - not only the newest request.
  // A reading is requested every half second while they talk and each takes
  // about a second to answer, so "newest only" cancelled every one of them
  // before it arrived: measured, nothing appeared until the speaker stopped.

  // With the call connected, everything heard is the restaurant: the Yolla tab
  // never carries his own voice, and staff echo his words back.
  const staffOnly = () => listener?.source === 'call';

  function heardInterim(text) {
    if (!text || (!staffOnly() && isOwnLine(text))) return;
    // The words themselves, immediately - before any translation exists.
    if (!early?.english) renderBand(radarRoot, { label: 'Hearing', text, tone: 'miss', jp: true });
    early ??= { read: '', english: '', timer: null, settle: null, row: null };
    if (early.row) history.update(early.row, { ja: text });
    else early.row = history.add('staff', text, '', { live: true });
    clearTimeout(early.timer);
    clearTimeout(early.settle);
    readEarly(text, { card: false });
    // A pause mid-sentence: only now suggest a card - a card that jumped around
    // while they were still talking would mislead.
    early.timer = setTimeout(() => readEarly(text, { card: true }), EARLY_STABLE_MS);
    early.settle = setTimeout(() => readEarly(text, { card: true, final: true }), SETTLED_MS);
  }

  function readEarly(text, { card, final = false }) {
    if (!early) return;
    const fresh = text !== early.read;           // English only for words not yet sent
    if (!fresh && !card) return;
    early.read = text;
    if (card && !final) addReading(early.row, text);   // a pause: read what has been said so far
    const seq = ++earlySeq;
    const context = recent.slice(-80).map(({ who, ja }) => ({ who, ja }));
    interpret(text, {
      recent: context, early: true, verdict: card, final, translate: fresh, staffOnly: staffOnly(), prefetch: !card,
      onEnglish: (reading, { done } = {}) => {
        if (!early || seq < englishShown || reading.self || !reading.english) return;
        // A newer reading takes over only once it says at least as much as the
        // line on screen: otherwise a finished "What date would you like" was
        // replaced by the next reading's first word, "What".
        if (seq > englishShown && !done && reading.english.length < (early.english?.length ?? 0)) return;
        englishShown = seq;
        early.english = reading.english;
        history.update(early.row, { en: reading.english });
        renderBand(radarRoot, { label: 'Saying', text: reading.english });
      },
      onVerdict: (reading, { final: authoritative } = {}) => {
        if (!early || seq < cardShown || reading.self) return;
        if (seq === cardShown && cardFinal && !authoritative) return;   // Opus 5.5 outranks Opus 5
        if (!reading.replyId && !reading.custom) return;
        cardShown = seq;
        cardFinal = Boolean(authoritative);
        markSuggested(reading.replyId, reading.custom);
      },
      // The finished sentence is read again anyway - unless nothing can work.
      onError: (lane, error) => { if (error.fatal) reportApiError(error, 'interpreter'); },
    });
  }

  function endEarly() {
    clearTimeout(early?.timer);
    clearTimeout(early?.settle);
    earlySeq += 1;               // any early reading still in flight is now stale
    englishShown = cardShown = earlySeq;
    cardFinal = false;
    early = null;
  }

  // Kana + romaji for a finished line, alongside its translation - never in its way.
  // Requested at every natural pause as well as when Chrome commits the
  // sentence - measured: Chrome can take 4.6 s to commit the last sentence
  // before a silence, or never, which left exactly that row without readings.
  // Only a reading newer than the one on screen is applied.
  function addReading(row, japanese) {
    if (!row || !japanese || !hasKey()) return;
    const seq = row.readAsked = (row.readAsked ?? 0) + 1;
    readJapanese(japanese)
      .then(reading => {
        if (seq <= (row.readShown ?? 0) || (!reading.kana && !reading.romaji)) return;
        row.readShown = seq;
        history.update(row, reading);
      })
      .catch(error => { if (error.fatal) reportApiError(error, 'reading'); });
  }

  function heardFinal(transcript) {
    const liveRow = early?.row;      // the row this sentence has been filling in
    endEarly();
    if (!staffOnly() && isOwnLine(transcript)) {   // one of his cards, read aloud
      const ownRow = liveRow ?? history.add('you', transcript);
      if (liveRow) history.update(liveRow, { who: 'you', ja: transcript, en: '', live: false });
      addReading(ownRow, transcript);
      recent.push({ who: 'you', ja: transcript, english: '', finalized: true });
      return;
    }
    // The WHOLE call, not a window: with only the last six lines, an agreement
    // to 17:00 made early on fell out of view, and at the read-back Opus
    // "corrected" him back to the 19:00 the staff had already refused.
    const context = recent.slice(-80).map(({ who, ja }) => ({ who, ja }));
    const entry = { who: 'pending', ja: transcript, english: '', finalized: false };
    recent.push(entry);
    entry.row = liveRow ?? history.add('staff', transcript, '', { live: true });
    history.update(entry.row, { ja: transcript });
    addReading(entry.row, transcript);

    interpret(transcript, {
      recent: context, staffOnly: staffOnly(),
      onEnglish: (reading, { done } = {}) => {
        if (done && !reading.self && !reading.english && entry.who !== 'you') {
          history.update(entry.row, { en: 'Unclear — ask them to repeat (press 1)', live: false });
          return;
        }
        if (reading.self || !reading.english || entry.who === 'you') return;
        entry.english = reading.english;
        if (done || reading.english.length >= (entry.row?.en?.length ?? 0)) {
          history.update(entry.row, { en: reading.english, ...(done ? { live: false } : {}) });
        }
        // A newer sentence already being spoken owns the band: the previous
        // sentence's late translation must not paint over it (measured:
        // "Thanks for calling" replaced 恐れ入ります mid-sentence).
        if (isCurrent(entry) && !early) showStaff(entry);
      },
      onVerdict: (reading, { final }) => {
        if (entry.finalized) return;
        if (repliesWithItself(transcript, reading.replyId)) reading = { ...reading, self: true, replyId: null };
        // A quick "staff, nothing to suggest" is the verdict it gets wrong on
        // his own echoed lines, and acting on it only clears his card. Let the
        // final verdict make that call.
        if (!final && !reading.self && !reading.replyId && !reading.custom) return;
        entry.finalized = final;
        if (reading.self) {
          // His own voice. If the quick verdict had taken it for staff, put
          // back the staff line he is answering, card and all.
          entry.who = 'you';
          history.update(entry.row, { who: 'you', en: '', live: false });
          interpreted.delete(transcript);
          const staff = latestStaff();
          showStaff(staff);
          if (staff) markSuggested(staff.replyId, staff.custom);
          return;
        }
        entry.who = 'staff';
        entry.replyId = reading.replyId;
        entry.custom = reading.custom;
        interpreted.set(transcript, { english: entry.english, replyId: reading.replyId, custom: reading.custom });
        if (!isCurrent(entry)) return;
        if (!early) showStaff(entry);
        markSuggested(reading.replyId, reading.custom);
      },
      onError: (lane, error) => {
        reportApiError(error, `interpreter (${lane})`);
        if (lane === 'english' && entry.who !== 'you' && isCurrent(entry) && !early) showStaff(entry);
      },
    });
  }

  const listener = createListener({
    // Only the call track: on speakerphone, provisional words are often his own voice.
    onInterim: text => { if (listener?.source === 'call' && hasKey()) heardInterim(text); },
    // Measured: on garbled or mixed speech Chrome sometimes ends a sentence with an
    // EMPTY final. Close it with the words it did show, so no row stays live forever.
    onRaw: (text, isFinal) => {
      if (isFinal && !text.trim() && early?.row?.ja && listener?.source === 'call' && hasKey()) heardFinal(early.row.ja);
    },
    onMatch: (result, meta) => {
      if (hasKey()) {
        // Interim results would repaint the band mid-sentence, and on
        // speakerphone they are often his own voice. Only finals are read.
        if (meta.isFinal && meta.transcript.trim()) heardFinal(meta.transcript.trim());
        return;
      }
      if (meta.isFinal && meta.transcript.trim()) {
        history.add('staff', meta.transcript.trim(), result.confident ? result.top.phrase.en : '');
      }
      renderRadar(radarRoot, result, { ...meta, onFallback: askClaude });
      // The matcher already knows where he is. Drive the script with it rather
      // than making him hunt for the stage himself.
      if (result.showReply && meta.isFinal) {
        const stage = stageIndexOfPhrase(result.top.phrase.replies?.[0]);
        if (stage >= 0) setStage(stage);
      }
    },
    // The green button must mean the mic is actually open. Clicks only ask;
    // the listener's own state (blocked, gave up, stopped) is what it shows.
    onStatus: text => { setStatus(text); toggle.dataset.on = String(listener.running); },
  });

  // Without this the laptop transcribes its own rehearsal audio — and on
  // speakerphone that audio also goes down the line to the restaurant.
  if (listener) setSpeechGate({ before: () => { if (listener.source === 'mic') listener.pause(); }, after: () => listener.resume() });

  if (!isSecureForMic()) {
    toggle.disabled = true;
    setStatus('open via https or localhost, not file://');
  } else if (!listener) {
    toggle.disabled = true;
    setStatus('speech recognition unsupported — use Chrome');
  } else {
    toggle.addEventListener('click', () => {
      if (listener.running) { listener.stop(); toggle.dataset.on = 'false'; }
      else { listener.start(); toggle.dataset.on = 'true'; }
    });
  }

  // ── Connect to the call (Yolla in a Chrome tab, earphones on) ─────────────
  // With earphones the staff's voice never reaches a microphone, so the laptop
  // mic would hear only him. Chrome can hand the Yolla tab's own audio to
  // speech recognition instead - verified in his Chrome: Japanese fed through a
  // track came back word-perfect with no microphone involved.
  const connectBtn = document.getElementById('connect-call');
  let callStream = null;

  function disconnectCall(message) {
    callStream?.getTracks().forEach(t => t.stop());
    callStream = null;
    listener?.setSource(null);
    listener?.stop();
    connectBtn.dataset.on = 'false';
    connectBtn.textContent = 'Connect call';
    setStatus(message);
  }

  async function connectCall() {
    if (callStream) { disconnectCall('call audio disconnected'); return; }
    preflight();
    if (!listener) { setStatus('speech recognition unsupported — use Chrome'); return; }
    let stream;
    try {
      stream = await navigator.mediaDevices.getDisplayMedia({
        // Chrome only shares tab audio alongside video; ask for as little as it allows.
        video: { displaySurface: 'browser', frameRate: 1, width: 320 },
        audio: { suppressLocalAudioPlayback: false },   // he still hears the call in his earphones
        preferCurrentTab: false, selfBrowserSurface: 'exclude',
        surfaceSwitching: 'include', systemAudio: 'exclude',
      });
    } catch (error) {
      setStatus(error.name === 'NotAllowedError' ? 'call audio: cancelled' : `call audio: ${error.message}`);
      return;
    }
    attachCallStream(stream);
  }

  // Everything after the share picker. Split out so an automated test can feed
  // recorded call audio through the exact path the Yolla tab takes.
  function attachCallStream(stream) {
    const [track] = stream.getAudioTracks();
    if (!track) {
      stream.getTracks().forEach(t => t.stop());
      setStatus('No sound shared — pick the Yolla tab and tick "Also share tab audio"');
      return;
    }
    callStream = stream;
    // Closing the Yolla tab or pressing "Stop sharing" ends the track. Say so
    // loudly and stop - never fall back to the mic behind his back, because with
    // earphones the mic hears only him.
    stream.getTracks().forEach(t => t.addEventListener('ended',
      () => disconnectCall('call audio lost — press Connect call again'), { once: true }));
    listener.setSource(track);
    if (!listener.running) listener.start();
    // No English recogniser alongside. On real human Japanese it invented
    // English ("I thought you called", "do you need help hi") - every such row
    // was noise that buried what was actually said. English words inside a
    // Japanese sentence (4 ピープル, OK, 7 pm) come through the Japanese one,
    // and if the staff switch fully to English he understands them directly.
    connectBtn.dataset.on = 'true';
    connectBtn.textContent = 'Call connected';
    setStatus('listening to the call');
  }
  connectBtn.addEventListener('click', connectCall);
  if (new URLSearchParams(location.search).has('debug')) window.callAssistant = { attachCallStream };
  if (!navigator.mediaDevices?.getDisplayMedia) connectBtn.disabled = true;

  document.getElementById('key-set').addEventListener('click', () => {
    const entered = prompt('Anthropic API key (stored only in this browser):', '');
    if (entered) setKey(entered);
  });

  async function runComposer() {
    const english = input.value.trim();
    if (!english) return;
    if (!hasKey()) { out.replaceChildren(note('Set an API key first.')); return; }
    out.replaceChildren(note('Translating…'));
    try { renderFallbackResult(out, await composeEnglish(english), 'self'); }
    catch (error) { out.replaceChildren(note(error.message)); }
  }
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && document.body.dataset.composer === 'open') {
      setComposer(false); event.preventDefault(); return;
    }
    if (event.target.tagName === 'INPUT' || event.metaKey || event.ctrlKey) return;
    if (event.key === '/') { setComposer(true); event.preventDefault(); }
    else if (event.key === 'ArrowRight') { nextStage(); event.preventDefault(); }
    else if (event.key === 'ArrowLeft') { prevStage(); event.preventDefault(); }
    else if (/^[1-5]$/.test(event.key)) { sayPanic(Number(event.key) - 1); event.preventDefault(); }
  });

  const startBtn = document.getElementById('start-call');
  startBtn.addEventListener('click', () => {
    const inCall = document.body.dataset.mode === 'call';
    document.body.dataset.mode = inCall ? 'prep' : 'call';
    if (!inCall) { recent.length = 0; markSuggested(null); showIdleBand(); history.clear(); preflight(); beginSession('call'); }
    else endSession();
    startBtn.textContent = inCall ? 'Start call' : 'End call';
    if (!inCall && listener && !listener.running) {
      listener.start(); toggle.dataset.on = 'true';
    }
  });

  // ── Rehearsal ────────────────────────────────────────────────────────────
  const rhStatus = document.getElementById('rh-status');
  const rhInput = document.getElementById('rh-input');
  const STATUS_TEXT = { idle: '—', staff: 'Staff speaking', you: 'Your turn',
                        thinking: 'Staff thinking…', ended: 'Ended' };
  const hasMic = isSecureForMic() && Boolean(window.SpeechRecognition ?? window.webkitSpeechRecognition);
  const listenerGate = listener
    ? { before: () => { if (listener.source === 'mic') listener.pause(); }, after: () => listener.resume() }
    : { before() {}, after() {} };
  let rehearsal = null;

  // During a rehearsal a panic phrase is a line he SAYS: play it, then send it
  // to the staff as his turn. Outside a rehearsal it just plays.
  function sayPanic(index) {
    const phrase = PANIC[index];
    if (!phrase) return;
    if (rehearsal?.state === 'you') {
      rehearsal.hold();
      speak(phrase, { onEnd: () => rehearsal?.submit(phrase.kanji) });
    } else {
      speakPanic(index);
    }
  }

  // The radar gets each staff line exactly as the real call's radar would, and
  // drives the script the same way.
  function showStaffOnRadar(turn) {
    rhInput.value = '';
    if (hasKey()) { heardFinal(turn.ja); return; }
    const result = match(turn.ja, STAFF);
    renderRadar(radarRoot, result, { transcript: turn.ja, isFinal: true, onFallback: askClaude });
    if (result.showReply) {
      const stage = stageIndexOfPhrase(result.top.phrase.replies?.[0]);
      if (stage >= 0) setStage(stage);
    }
  }

  const scenarioSelect = document.getElementById('rh-scenario');
  for (const [value, { label }] of scenariosFor(RESTAURANT)) {
    scenarioSelect.append(new Option(`Scenario: ${label}`, value));
  }

  function startRehearsal() {
    preflight();
    if (!hasKey()) {
      const entered = prompt('The staff in the rehearsal is played by Claude.\nAnthropic API key (stored only in this browser):', '');
      if (!entered) return;
      setKey(entered);
    }
    if (listener?.running) { listener.stop(); toggle.dataset.on = 'false'; }
    document.body.dataset.debrief = 'closed';
    document.body.dataset.mode = 'call';
    document.body.dataset.rehearse = 'on';
    rhInput.value = '';
    recent.length = 0; interpreted.clear(); markSuggested(null); history.clear();
    beginSession('rehearsal');
    rhInput.placeholder = hasMic ? 'Speak your reply — or type it' : 'No microphone here — type your reply';
    setStage(0);

    rehearsal = createRehearsal({
      sim: createStaffSim({ callClaude, streamClaude, scenario: scenarioSelect.value }),
      onStaff: showStaffOnRadar,
      onYou: ({ text, final }) => {
        if (final) {
          recent.push({ who: 'you', ja: text, english: '', finalized: true });
          addReading(history.add('you', text), text);
        }
        if (document.activeElement !== rhInput) rhInput.value = text;
      },
      onStatus: state => { rhStatus.dataset.state = state; rhStatus.textContent = STATUS_TEXT[state] ?? state; },
      onEnd: finishRehearsal,
      // Errors go in the input's placeholder, never over the status pill — the
      // pill is the only thing that says whose turn it is.
      onError: message => {
        rhInput.placeholder = message;
        if (/credit balance|billing|api key|authentication/i.test(message)) {
          reportApiError(Object.assign(new Error(message), { fatal: true }), 'rehearsal');
        }
      },
    });
    setSpeechGate({ before: () => rehearsal?.hold(), after: () => rehearsal?.resume() });
    rehearsal.start();
  }

  function finishRehearsal(turns) {
    endSession();
    const staffTurns = turns.filter(t => t.who === 'staff');
    const readings = new Map(history.snapshot().filter(r => r.kana || r.romaji)
      .map(r => [r.ja, { kana: r.kana, romaji: r.romaji }]));
    renderDebrief(document.getElementById('debrief-body'), turns, scoreRadar(staffTurns), interpreted, readings);
    setSpeechGate(listenerGate);
    rehearsal = null;
    document.body.dataset.rehearse = 'off';
    document.body.dataset.mode = 'prep';
    document.body.dataset.debrief = 'open';
  }

  function sendTyped() {
    const text = rhInput.value.trim();
    if (text && rehearsal) rehearsal.submit(text);
  }

  document.getElementById('rehearse-btn').addEventListener('click', startRehearsal);
  document.getElementById('rh-send').addEventListener('click', sendTyped);
  document.getElementById('rh-repeat').addEventListener('click', () => rehearsal?.repeat());
  document.getElementById('rh-slow').addEventListener('click', () => rehearsal?.repeatSlowly());
  document.getElementById('rh-end').addEventListener('click', () => rehearsal?.end());
  document.getElementById('rh-hide-radar').addEventListener('change', e => {
    document.body.dataset.radar = e.target.checked ? 'hidden' : 'shown';
  });
  // Typing closes the mic, so the laptop does not also transcribe the room.
  rhInput.addEventListener('focus', () => rehearsal?.hold());
  rhInput.addEventListener('blur', () => rehearsal?.resume());
  rhInput.addEventListener('keydown', e => { if (e.key === 'Enter') { sendTyped(); e.preventDefault(); } });
  document.getElementById('debrief-again').addEventListener('click', startRehearsal);
  document.getElementById('debrief-close').addEventListener('click', () => {
    document.body.dataset.debrief = 'closed';
  });

  // ── Past calls viewer ──────────────────────────────────────────────────
  const pastBody = document.getElementById('past-body');
  const pastTitle = document.getElementById('past-title');
  const pastBack = document.getElementById('past-back');
  const node = (tag, className, text) => Object.assign(document.createElement(tag),
    { className: className ?? '', ...(text !== undefined ? { textContent: text } : {}) });

  function showPastList() {
    pastTitle.textContent = 'Past calls';
    pastBack.hidden = true;
    const sessions = loadSessions();
    if (!sessions.length) { pastBody.replaceChildren(node('p', 'past__empty', 'No saved calls yet. Each call and rehearsal is saved here as it happens.')); return; }
    const list = node('ol', 'past__list');
    for (const s of sessions) {
      const item = node('li', 'past__item');
      const open = node('button', 'past__open', describeSession(s));
      open.addEventListener('click', () => showPastSession(s));
      const copy = node('button', 'past__copy', 'Copy');
      copy.addEventListener('click', async () => {
        try { await navigator.clipboard.writeText(sessionToText(s)); copy.textContent = 'Copied'; }
        catch { copy.textContent = 'Copy failed'; }
      });
      const del = node('button', 'past__delete', 'Delete');
      del.addEventListener('click', () => {
        if (confirm(`Delete this transcript?\n\n${describeSession(s)}`)) { deleteSession(s.id); showPastList(); }
      });
      item.append(open, copy, del);
      list.append(item);
    }
    pastBody.replaceChildren(list);
  }

  function showPastSession(s) {
    pastTitle.textContent = describeSession(s);
    pastBack.hidden = false;
    const turns = node('ol', 'past__turns');
    for (const r of s.rows) {
      const li = node('li', `turn turn--${r.who}`);
      const secs = Math.max(0, Math.round((r.at ?? 0) / 1000));
      li.append(node('span', 'turn__at', `${String(Math.floor(secs / 60)).padStart(2, '0')}:${String(secs % 60).padStart(2, '0')}`));
      if (r.who === 'you') li.append(node('span', 'turn__who', 'You'));
      if (r.who !== 'you' && r.en) li.append(node('p', 'turn__en', r.en));
      if (r.ja) li.append(node('p', 'turn__ja', r.ja));
      if (r.kana) li.append(node('p', 'turn__kana', r.kana));
      if (r.romaji) li.append(node('p', 'turn__romaji', r.romaji));
      turns.append(li);
    }
    pastBody.replaceChildren(turns);
  }

  document.getElementById('past-btn').addEventListener('click', () => { showPastList(); document.body.dataset.past = 'open'; });
  document.getElementById('past-close').addEventListener('click', () => { document.body.dataset.past = 'closed'; });
  pastBack.addEventListener('click', showPastList);

  document.getElementById('composer-go').addEventListener('click', runComposer);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') runComposer(); });
</script>
</body>
</html>
