<!DOCTYPE html>
<html lang="ja" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="google" content="notranslate">
<meta name="theme-color" content="#0e0d0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>日本語 — Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@300;400;600&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: 'Crimson Pro', Georgia, serif;
  background: #0e0d0b;
  color: #e8e2d9;
  min-height: 100vh;
  min-height: 100dvh;
  overscroll-behavior-y: contain;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}
button { font-family: inherit; -webkit-appearance: none; appearance: none; }

/* ── Top bar ── */
.top-bar {
  position: sticky;
  top: 0;
  z-index: 100;
  min-height: 48px;
  padding-top: max(12px, env(safe-area-inset-top));
  padding-bottom: 12px;
  padding-left: max(16px, env(safe-area-inset-left));
  padding-right: max(16px, env(safe-area-inset-right));
  background: #0e0d0b;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.top-bar-left, .top-bar-right {
  display: flex;
  align-items: center;
  gap: 8px;
}
/* ── Mode switcher ── */
.mode-switcher {
  display: flex;
  gap: 4px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 8px;
  padding: 3px;
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
}
.mode-btn {
  font-family: 'Crimson Pro', Georgia, serif;
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  padding: 5px 14px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  transition: background 150ms, color 150ms;
  white-space: nowrap;
  min-height: 30px;
}
.mode-btn.active {
  background: #c8b99a;
  color: #0e0d0b;
}
.mode-btn.inactive {
  background: transparent;
  color: #6b5e45;
}
.mode-btn.inactive:hover, .mode-btn.inactive:focus-visible {
  color: #a89880;
  background: rgba(255,255,255,0.04);
  outline: none;
}
@media (prefers-reduced-motion: reduce) {
  .mode-btn { transition: none; }
}
.btn-mode {
  background: none;
  border: 1px solid rgba(200,185,154,0.25);
  color: #6b5e45;
  font-size: 14px;
  width: 36px;
  height: 36px;
  border-radius: 2px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
  transition: border-color 0.2s, color 0.2s;
  flex-shrink: 0;
}
.btn-mode:hover, .btn-mode:focus-visible, .btn-mode:active {
  border-color: rgba(200,185,154,0.5);
  color: #c8b99a;
  outline: none;
}

/* ── Main ── */
.main {
  padding-top: 32px;
  padding-left: max(16px, env(safe-area-inset-left));
  padding-right: max(16px, env(safe-area-inset-right));
  padding-bottom: max(64px, calc(40px + env(safe-area-inset-bottom)));
  min-height: calc(100dvh - 48px);
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-x: hidden;
}

/* ── Card ── */
.card {
  width: 100%;
  max-width: 520px;
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 2px;
  background: rgba(255,255,255,0.02);
}

/* ── Drill selection ── */
.select-screen { width: 100%; max-width: 520px; padding: 0; }
.select-heading {
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #6b5e45;
  margin-bottom: 16px;
}
.drill-cards { display: flex; flex-direction: column; gap: 10px; margin-bottom: 40px; }
.select-divider {
  border: none;
  border-top: 1px solid rgba(255,255,255,0.06);
  margin: 0 0 28px;
}
.drill-card {
  width: 100%;
  background: rgba(255,255,255,0.02);
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 2px;
  padding: 16px 20px;
  cursor: pointer;
  text-align: left;
  transition: border-color 0.15s, background 0.15s;
  min-height: 44px;
  user-select: none;
  box-sizing: border-box;
}
.drill-card:hover, .drill-card:focus-visible, .drill-card:active {
  border-color: rgba(200,185,154,0.3);
  background: rgba(255,255,255,0.04);
  outline: none;
}
.drill-card.selected {
  border-color: rgba(200,185,154,0.6);
  background: rgba(168,152,128,0.08);
}
.drill-card:disabled {
  opacity: 0.38;
  cursor: not-allowed;
  pointer-events: none;
}
.drill-card-label {
  font-family: 'Noto Serif JP', serif;
  font-size: 15px;
  color: #c8b99a;
  margin-bottom: 4px;
}
.drill-card-desc {
  font-size: 13px;
  color: #6b5e45;
  font-style: italic;
}
.drill-notice {
  font-size: 12px;
  color: #a07050;
  font-style: italic;
  margin-top: 10px;
  margin-bottom: 20px;
}

/* ── Round length selector ── */
.round-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 32px;
}
.round-label {
  font-size: 12px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #6b5e45;
  flex-shrink: 0;
}
.round-btns { display: flex; gap: 8px; }
.btn-round {
  background: none;
  border: 1px solid rgba(200,185,154,0.25);
  color: #6b5e45;
  font-family: 'Crimson Pro', Georgia, serif;
  font-size: 14px;
  min-width: 56px;
  min-height: 44px;
  padding: 10px 16px;
  border-radius: 2px;
  cursor: pointer;
  transition: border-color 0.15s, color 0.15s, background 0.15s;
  user-select: none;
}
.btn-round:hover, .btn-round:focus-visible, .btn-round:active {
  border-color: rgba(200,185,154,0.5);
  color: #c8b99a;
  outline: none;
}
.btn-round.selected {
  border-color: rgba(200,185,154,0.7);
  color: #c8b99a;
  background: rgba(168,152,128,0.12);
}

/* ── Start button ── */
.btn-start {
  width: 100%;
  max-width: 520px;
  background: rgba(200,185,154,0.1);
  border: 1px solid rgba(200,185,154,0.35);
  color: #c8b99a;
  font-family: 'Crimson Pro', Georgia, serif;
  font-size: 15px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 14px;
  border-radius: 2px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
  min-height: 52px;
  user-select: none;
  box-sizing: border-box;
}
.btn-start:hover, .btn-start:focus-visible, .btn-start:active {
  background: rgba(200,185,154,0.18);
  border-color: rgba(200,185,154,0.6);
  outline: none;
}
.btn-start:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

/* ── Quiz card ── */
.quiz-card { width: 100%; max-width: 520px; }
.card-header {
  padding: 14px 20px 12px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.card-drill-name {
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: #6b5e45;
}
.card-progress-text {
  font-size: 12px;
  color: #6b5e45;
  font-variant-numeric: tabular-nums;
}

/* Progress bar */
.progress-bar-wrap {
  height: 2px;
  background: rgba(255,255,255,0.05);
  overflow: hidden;
}
.progress-bar-fill {
  height: 100%;
  background: #a89880;
  transition: width 0.3s ease;
}
@media (prefers-reduced-motion: reduce) {
  .progress-bar-fill { transition: none; }
}

/* Question area */
.question-area {
  padding: 36px 24px 28px;
  text-align: center;
  user-select: text;
}
.q-kanji {
  font-family: 'Noto Serif JP', serif;
  font-size: min(14vw, 5rem);
  font-weight: 300;
  color: #f0ebe0;
  line-height: 1.2;
  word-break: keep-all;
  max-width: 100%;
  overflow-wrap: break-word;
}
.q-reading {
  font-family: 'Noto Serif JP', serif;
  font-size: 1.8rem;
  font-weight: 300;
  color: #a89880;
  letter-spacing: 0.04em;
  margin-bottom: 8px;
}
.q-meaning {
  font-size: 1.1rem;
  color: #6b5e45;
  font-style: italic;
}

/* Options */
.options-list {
  list-style: none;
  border-top: 1px solid rgba(255,255,255,0.05);
}
.options-list li { border-bottom: 1px solid rgba(255,255,255,0.04); }
.options-list li:last-child { border-bottom: none; }
.btn-option {
  width: 100%;
  background: none;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 14px 20px;
  min-height: 56px;
  transition: background 0.12s;
  user-select: none;
  white-space: normal;
  word-break: break-word;
  text-align: left;
  box-sizing: border-box;
}
.btn-option:hover, .btn-option:focus-visible, .btn-option:active {
  background: rgba(255,255,255,0.03);
  outline: none;
}
.btn-option:disabled { cursor: default; }
.btn-option:disabled:hover { background: none; }
.option-key {
  font-size: 11px;
  letter-spacing: 0.1em;
  color: #4a4030;
  width: 16px;
  flex-shrink: 0;
  text-transform: uppercase;
  padding-top: 2px;
}
.option-text {
  font-family: 'Noto Serif JP', serif;
  font-size: 15px;
  color: #c8b99a;
  text-align: left;
  line-height: 1.5;
}
.option-text .opt-en {
  font-family: 'Crimson Pro', Georgia, serif;
  font-size: 13px;
  color: #6b5e45;
  font-style: italic;
}

/* Answer feedback states */
.btn-option.correct {
  background: rgba(120,200,120,0.12);
  border-left: 3px solid rgba(120,200,120,0.6);
}
.btn-option.wrong {
  background: rgba(200,80,80,0.12);
  border-left: 3px solid rgba(200,80,80,0.5);
}
@media (prefers-reduced-motion: reduce) {
  .btn-option.correct, .btn-option.wrong { transition: none; }
}

/* ── Katakana English reveal ── */
.katakana-english {
  font-family: 'Crimson Pro', Georgia, serif;
  font-style: italic;
  font-size: 1.1rem;
  color: #a89880;
  text-align: center;
  margin-top: 10px;
  opacity: 0;
  transition: opacity 200ms ease;
  min-height: 1.4em;
}
.katakana-english.visible { opacity: 1; }
@media (prefers-reduced-motion: reduce) {
  .katakana-english { transition: none; }
}

/* ── Example sentence reveal (correct answer only) ── */
.example-reveal {
  opacity: 0;
  transition: opacity 200ms ease;
  padding: 0 4px;
  min-height: 60px;
}
.example-reveal.visible { opacity: 1; }
.example-divider {
  border: none;
  border-top: 1px solid rgba(255,255,255,0.07);
  margin: 14px 0 12px;
}
body.light .example-divider { border-top-color: rgba(0,0,0,0.08); }
.example-jp {
  font-family: 'Noto Serif JP', serif;
  font-size: 1.1rem;
  font-weight: 300;
  color: #e8e2d9;
  line-height: 1.8;
  margin-bottom: 4px;
  text-align: center;
}
.example-en {
  font-family: 'Crimson Pro', Georgia, serif;
  font-style: italic;
  font-size: 0.95rem;
  color: #a89880;
  line-height: 1.5;
  text-align: center;
}
body.light .example-jp { color: #2a1e0a; }
body.light .example-en { color: #8a6040; }
@media (prefers-reduced-motion: reduce) {
  .example-reveal { transition: none; }
}
@media (max-width: 400px) {
  .example-jp { font-size: 1rem; }
  .example-en { font-size: 0.88rem; }
}

/* ── Next button (correct answer) ── */
.btn-next {
  font-family: 'Crimson Pro', Georgia, serif;
  font-size: 1rem;
  letter-spacing: 0.08em;
  padding: 12px 0;
  margin: 20px auto 0;
  width: calc(100% - 40px);
  max-width: 420px;
  background: transparent;
  border: 1px solid rgba(200,185,154,0.35);
  border-radius: 8px;
  color: #c8b99a;
  cursor: pointer;
  display: block;
  transition: border-color 150ms, color 150ms;
}
.btn-next:hover { border-color: #c8b99a; color: #e8d9ba; }
body.light .btn-next { border-color: rgba(100,70,40,0.3); color: #8a6040; }
body.light .btn-next:hover { border-color: #8a6040; color: #5a3010; }

/* ── Results screen ── */
.results-card {
  width: 100%;
  max-width: 520px;
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 2px;
  background: rgba(255,255,255,0.02);
  padding: 40px 32px 36px;
  text-align: center;
}
.results-label {
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: #6b5e45;
  margin-bottom: 28px;
}
.results-score {
  font-family: 'Noto Serif JP', serif;
  font-size: 3.5rem;
  font-weight: 300;
  color: #f0ebe0;
  line-height: 1;
  margin-bottom: 10px;
}
.results-pct {
  font-size: 1.2rem;
  color: #a89880;
  margin-bottom: 36px;
}
.results-btns { display: flex; flex-direction: column; gap: 12px; }
.btn-results {
  width: 100%;
  background: none;
  border: 1px solid rgba(200,185,154,0.3);
  color: #c8b99a;
  font-family: 'Crimson Pro', Georgia, serif;
  font-size: 14px;
  letter-spacing: 0.08em;
  padding: 13px 20px;
  border-radius: 2px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
  min-height: 48px;
  user-select: none;
}
.btn-results:hover, .btn-results:focus-visible, .btn-results:active {
  background: rgba(200,185,154,0.08);
  border-color: rgba(200,185,154,0.55);
  outline: none;
}

/* ── Light mode ── */
body.light {
  background: #f5efe3;
  color: #2a1e0a;
}
body.light .top-bar {
  background: #f5efe3;
  border-bottom-color: rgba(0,0,0,0.08);
}
body.light .top-title { color: #8a6040; }
body.light .btn-mode { border-color: rgba(100,70,40,0.3); color: #7a5830; }
body.light .btn-mode:hover, body.light .btn-mode:focus-visible { border-color: rgba(100,70,40,0.6); color: #3a1e00; }
body.light .mode-switcher { background: rgba(0,0,0,0.04); border-color: rgba(0,0,0,0.08); }
body.light .mode-btn.active { background: #8a6040; color: #f5efe3; }
body.light .mode-btn.inactive { color: #b09070; }
body.light .mode-btn.inactive:hover, body.light .mode-btn.inactive:focus-visible { color: #8a6040; background: rgba(0,0,0,0.04); }
body.light .select-heading { color: #8a6040; }
body.light .drill-card { background: rgba(0,0,0,0.02); border-color: rgba(0,0,0,0.1); }
body.light .drill-card:hover, body.light .drill-card:focus-visible { background: rgba(0,0,0,0.04); border-color: rgba(100,70,40,0.3); }
body.light .drill-card.selected { border-color: rgba(100,70,40,0.6); background: rgba(100,70,40,0.07); }
body.light .drill-card-label { color: #2a1e0a; }
body.light .drill-card-desc { color: #8a6040; }
body.light .drill-notice { color: #c05030; }
body.light .round-label { color: #8a6040; }
body.light .btn-round { border-color: rgba(100,70,40,0.3); color: #7a5830; }
body.light .btn-round:hover, body.light .btn-round:focus-visible { border-color: rgba(100,70,40,0.6); color: #3a1e00; }
body.light .btn-round.selected { border-color: rgba(100,70,40,0.7); color: #3a1e00; background: rgba(100,70,40,0.08); }
body.light .btn-start { background: rgba(100,70,40,0.08); border-color: rgba(100,70,40,0.35); color: #5a3010; }
body.light .btn-start:hover, body.light .btn-start:focus-visible { background: rgba(100,70,40,0.14); border-color: rgba(100,70,40,0.6); }
body.light .card, body.light .quiz-card .card, body.light .results-card {
  border-color: rgba(0,0,0,0.1);
  background: rgba(0,0,0,0.02);
}
body.light .card-header { border-bottom-color: rgba(0,0,0,0.08); }
body.light .card-drill-name { color: #8a6040; }
body.light .card-progress-text { color: #8a6040; }
body.light .progress-bar-wrap { background: rgba(0,0,0,0.08); }
body.light .progress-bar-fill { background: #8a6040; }
body.light .q-kanji { color: #1a0e00; }
body.light .q-reading { color: #8a6040; }
body.light .q-meaning { color: #8a6040; }
body.light .katakana-english { color: #8a6040; }
body.light .options-list li { border-bottom-color: rgba(0,0,0,0.06); }
body.light .btn-option:hover, body.light .btn-option:focus-visible { background: rgba(0,0,0,0.03); }
body.light .option-key { color: #b0906a; }
body.light .option-text { color: #3a1e00; }
body.light .option-text .opt-en { color: #8a6040; }
body.light .btn-option.correct { background: rgba(60,140,60,0.1); border-left-color: rgba(60,140,60,0.5); }
body.light .btn-option.wrong { background: rgba(180,50,50,0.1); border-left-color: rgba(180,50,50,0.5); }
body.light .results-card { border-color: rgba(0,0,0,0.1); background: rgba(0,0,0,0.02); }
body.light .results-label { color: #8a6040; }
body.light .results-score { color: #1a0e00; }
body.light .results-pct { color: #8a6040; }
body.light .btn-results { border-color: rgba(100,70,40,0.3); color: #5a3010; }
body.light .btn-results:hover, body.light .btn-results:focus-visible { background: rgba(100,70,40,0.07); border-color: rgba(100,70,40,0.55); }
body.light .select-divider { border-top-color: rgba(0,0,0,0.1); }

@media (max-width: 400px) {
  .drill-card { padding: 14px 16px; }
  .drill-card-label { font-size: 14px; }
  .drill-card-desc { font-size: 12px; }
  .btn-option { padding: 12px 14px; font-size: 0.95rem; }
  .question-area { padding: 24px 16px 20px; }
  .mode-btn { padding: 5px 10px; font-size: 11px; }
}

/* ── Streak chip ── */
.streak-chip {
  display: flex;
  align-items: center;
  gap: 3px;
  font-family: 'Crimson Pro', Georgia, serif;
  font-size: 15px;
  line-height: 1;
  cursor: default;
  user-select: none;
  transition: opacity 200ms;
}
.streak-chip.zero { opacity: 0.35; }
.streak-flame { font-size: 16px; line-height: 1; }
.streak-count { font-size: 15px; font-weight: 400; color: #c8b99a; min-width: 14px; }
body.light .streak-count { color: #8a6040; }
@keyframes streak-pulse {
  0%   { transform: scale(1); }
  40%  { transform: scale(1.4); }
  100% { transform: scale(1); }
}
.streak-chip.just-increased .streak-flame { animation: streak-pulse 500ms ease-out; }
@media (prefers-reduced-motion: reduce) {
  .streak-chip.just-increased .streak-flame { animation: none; }
}

/* ── Quiz sync status badge ── */
.quiz-sync-badge {
  font-family: 'Crimson Pro', Georgia, serif;
  font-size: 0.78rem;
  letter-spacing: 0.04em;
  color: #a89880;
  opacity: 0.8;
  white-space: nowrap;
  transition: opacity 600ms;
}
.quiz-sync-badge.synced { color: #a89880; }
.quiz-sync-badge.failed { color: #c8964a; }
body.light .quiz-sync-badge.synced { color: #8a6040; }
body.light .quiz-sync-badge.failed { color: #b06020; }

/* ── Results streak line ── */
.results-streak {
  font-family: 'Crimson Pro', Georgia, serif;
  font-size: 1rem;
  color: #a89880;
  margin-top: 6px;
  margin-bottom: 24px;
  text-align: center;
}
.results-streak strong { color: #c8b99a; }
body.light .results-streak { color: #8a6040; }
body.light .results-streak strong { color: #6a3010; }
.results-sync-hint {
  font-family: 'Crimson Pro', Georgia, serif;
  font-style: italic;
  font-size: 0.85rem;
  color: #8a7f6e;
  margin-top: -14px;
  margin-bottom: 22px;
  text-align: center;
}

//  STATE
// ═══════════════════════════════════════════════════════════════
const LS_MODE           = 'jp-vocab-mode';
const LS_ROUND_LEN      = 'jp-quiz-round-length';
const LS_VOCAB          = 'jp-vocab-deck';
const LS_STREAK_CURRENT = 'jp-streak-current';
const LS_STREAK_BEST    = 'jp-streak-best';
const LS_STREAK_DATE    = 'jp-streak-date';
const LS_GH_TOKEN       = 'jp-vocab-gh-token';
const LS_GH_GIST        = 'jp-vocab-gh-gist';
const GIST_FILENAME     = 'japanese-deck.json';

const state = {
  screen:       'select',
  drillType:    null,
  roundLength:  10,
  questions:    [],
  currentIndex: 0,
  score:        0,
  answered:     false,
};

// Result of the most recent recordActivity() — drives the results-screen sync hint.
let lastStreakResult = null;

// ═══════════════════════════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════════════════════════
function lsGet(k) { try { return localStorage.getItem(k); } catch(e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch(e) {} }

// ── Streak helpers (stored inside jp-vocab-deck for Gist sync) ──

function getDeckRaw() {
  try {
    const raw = localStorage.getItem('jp-vocab-deck');
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}

function saveDeckRaw(deck) {
  try { localStorage.setItem('jp-vocab-deck', JSON.stringify(deck)); } catch(e) {}
}

function todayStr() {
  return new Date().toLocaleDateString('en-CA'); // YYYY-MM-DD local time
}

function getStreak() {
  const deck = getDeckRaw();
  const s = (deck && deck.settings && deck.settings.streak) || {};
  return {
    current: parseInt(s.current || '0', 10),
    best:    parseInt(s.best    || '0', 10),
    date:    s.date || null,
  };
}

function recordActivity() {
  const today = todayStr();
  const s = getStreak();

  if (s.date === today) return { current: s.current, best: s.best, increased: false };

  let newCurrent;
  if (!s.date) {
    newCurrent = 1;
  } else {
    const diffDays = Math.round((new Date(today) - new Date(s.date)) / 86400000);
    newCurrent = (diffDays === 1) ? s.current + 1 : 1;
  }
  const newBest = Math.max(newCurrent, s.best);

  // Write streak back into deck.settings.streak so Gist sync picks it up
  const deck = getDeckRaw() || { version: 3, words: [], tombstones: [], settings: {} };
  if (!deck.settings) deck.settings = {};
  deck.settings.streak = { current: newCurrent, best: newBest, date: today };
  saveDeckRaw(deck);

  // Also keep the old standalone keys as a fallback for the vocab app's read-only display
  try {
    localStorage.setItem('jp-streak-current', String(newCurrent));
    localStorage.setItem('jp-streak-best',    String(newBest));
    localStorage.setItem('jp-streak-date',    today);
  } catch(e) {}

  return { current: newCurrent, best: newBest, increased: newCurrent > s.current };
}

function renderStreakChip() {
  const s = getStreak();
  const chip  = document.getElementById('streakChip');
  const count = document.getElementById('streakCount');
  if (!chip || !count) return;
  count.textContent = s.current;
  chip.classList.toggle('zero', s.current === 0);
}

// ── Read-only Gist streak sync ──
// Merge two streak objects: current/date from the later date, best is the max.
function mergeStreak(a, b) {
  a = a || {}; b = b || {};
  if (!a.date && !b.date) return null;
  let primary;
  if (!a.date) primary = b;
  else if (!b.date) primary = a;
  else primary = (a.date >= b.date) ? a : b;
  return {
    current: parseInt(primary.current || 0, 10),
    date:    primary.date,
    best:    Math.max(parseInt(a.best || 0, 10), parseInt(b.best || 0, 10),
                      parseInt(a.current || 0, 10), parseInt(b.current || 0, 10)),
  };
}

function ghHeaders() {
  return {
    'Authorization': 'Bearer ' + lsGet(LS_GH_TOKEN),
    'Accept': 'application/vnd.github+json',
    'X-GitHub-Api-Version': '2022-11-28',
    'Content-Type': 'application/json'
  };
}

// GET-only fetch of the synced deck from the Gist. Never pushes.
async function ghPullDeck() {
  const token = lsGet(LS_GH_TOKEN), gistId = lsGet(LS_GH_GIST);
  if (!token || !gistId) return null;
  const res = await fetch('https://api.github.com/gists/' + gistId, { headers: ghHeaders() });
  if (!res.ok) return null;
  const data = await res.json();
  const file = data.files && data.files[GIST_FILENAME];
  if (!file) return null;
  let content = file.content;
  if (file.truncated && file.raw_url) {
    const r2 = await fetch(file.raw_url);
    if (!r2.ok) return null;
    content = await r2.text();
  }
  try { return JSON.parse(content); } catch (e) { return null; }
}

// On load, pull the streak from the Gist (read-only) and adopt it if better.
async function syncStreakFromGist() {
  const badge = document.getElementById('quizSyncBadge');
  // Not configured — leave the badge hidden, show nothing.
  if (!lsGet(LS_GH_TOKEN) || !lsGet(LS_GH_GIST)) return;

  // Glyph-only badge — no label text, so it can never overlap the mode switcher.
  const showBadge = (cls, glyph, title, autohide) => {
    if (!badge) return;
    badge.textContent = glyph;
    badge.title = title;
    badge.className = 'quiz-sync-badge ' + cls;
    badge.hidden = false;
    if (autohide) setTimeout(() => { badge.hidden = true; }, 4000);
  };

  try {
    const remote = await Promise.race([
      ghPullDeck(),
      new Promise(r => setTimeout(() => r(null), 3000))
    ]);
    // null = timed out or the pull failed/returned nothing.
    if (!remote) { showBadge('failed', '⚠', 'Sync failed — check your token', false); return; }

    const remoteStreak = remote.settings && remote.settings.streak;
    if (remoteStreak) {
      const local = getDeckRaw() || { version: 3, words: [], tombstones: [], settings: {} };
      if (!local.settings) local.settings = {};
      const merged = mergeStreak(local.settings.streak, remoteStreak);
      if (merged && JSON.stringify(merged) !== JSON.stringify(local.settings.streak || null)) {
        local.settings.streak = merged;
        saveDeckRaw(local);
        if (merged.date) {
          lsSet(LS_STREAK_CURRENT, String(merged.current || 0));
          lsSet(LS_STREAK_BEST,    String(merged.best || 0));
          lsSet(LS_STREAK_DATE,    merged.date);
        }
      }
    }
    // Always reflect the post-pull localStorage value, even if nothing changed.
    renderStreakChip();
    showBadge('synced', '✓', 'Synced with Gist', true);
  } catch (e) {
    showBadge('failed', '⚠', 'Sync failed — check your token', false);
  }
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickDistractors(pool, exclude, count) {
  const filtered = pool.filter(x => x !== exclude);
  return shuffle(filtered).slice(0, count);
}

function loadVocabWords() {
  const raw = lsGet(LS_VOCAB);
  if (!raw) return [];
  try {
    const deck = JSON.parse(raw);
    return (deck.words || []).filter(w => w.w && w.r && w.m);
  } catch(e) { return []; }
}

function reducedMotion() {
  return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

// ═══════════════════════════════════════════════════════════════
//  BUILD QUESTIONS
// ═══════════════════════════════════════════════════════════════
function buildQuestions() {
  const { drillType, roundLength } = state;

  if (drillType === 'katakana-reading') {
    const shuffled = shuffle(KATAKANA_BANK);
    const questions = [];
    for (let i = 0; i < roundLength; i++) {
      const correct = shuffled[i % shuffled.length];
      const distractors = pickDistractors(KATAKANA_BANK, correct, 3);
      const options = shuffle([
        { ...correct, isCorrect: true },
        ...distractors.map(d => ({ ...d, isCorrect: false })),
      ]);
      questions.push({ katakana: correct, options });
    }
    return questions;
  }

  // vocab drills
  const words = loadVocabWords();
  const pool = shuffle(words);
  const questions = [];
  const usedIndices = new Set();

  for (let i = 0; i < roundLength; i++) {
    let wordIdx;
    if (usedIndices.size < pool.length) {
      for (let j = 0; j < pool.length; j++) {
        if (!usedIndices.has(j)) { wordIdx = j; break; }
      }
      usedIndices.add(wordIdx);
    } else {
      wordIdx = Math.floor(Math.random() * pool.length);
    }
    const correct = pool[wordIdx];
    const distractors = pickDistractors(pool, correct, 3);
    const options = shuffle([
      { ...correct, isCorrect: true },
      ...distractors.map(d => ({ ...d, isCorrect: false })),
    ]);
    questions.push({ word: correct, options });
  }
  return questions;
}

// ═══════════════════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════════════════
function render() {
  const main = document.getElementById('main');
  if (state.screen === 'select')  { main.innerHTML = renderSelect();  }
  if (state.screen === 'quiz')    { main.innerHTML = renderQuiz();    }
  if (state.screen === 'results') { main.innerHTML = renderResults(); }
}

// ── Screen 1 ──
function renderSelect() {
  const words = loadVocabWords();
  const enoughWords = words.length >= 4;
  const saved = parseInt(lsGet(LS_ROUND_LEN), 10);
  if ([5, 10, 20].includes(saved)) state.roundLength = saved;

  const drills = [
    { id: 'kanji-to-reading', label: 'Kanji → Reading & Meaning', desc: 'See a kanji word. Pick its hiragana reading + English meaning from 4 options.', needsVocab: true },
    { id: 'reading-to-kanji', label: 'Reading → Kanji',          desc: 'See the hiragana reading and English meaning. Pick the correct kanji from 4 options.', needsVocab: true },
    { id: 'katakana-reading', label: 'Katakana Reading Drill',    desc: 'See a katakana word. Pick its hiragana reading from 4 options.', needsVocab: false },
  ];

  const drillCards = drills.map(d => {
    const disabled = d.needsVocab && !enoughWords;
    const selected = state.drillType === d.id;
    return `<button class="drill-card${selected ? ' selected' : ''}"
      ${disabled ? 'disabled' : ''}
      onclick="selectDrill('${d.id}')"
      aria-pressed="${selected}">
      <div class="drill-card-label">${d.label}</div>
      <div class="drill-card-desc">${d.desc}</div>
    </button>`;
  }).join('');

  const notice = !enoughWords
    ? `<p class="drill-notice">Add at least 4 words to your vocabulary deck to use the kanji drills.</p>`
    : '';

  const roundBtns = [5, 10, 20].map(n =>
    `<button class="btn-round${state.roundLength === n ? ' selected' : ''}" onclick="setRoundLength(${n})" aria-pressed="${state.roundLength === n}">${n}</button>`
  ).join('');

  const canStart = state.drillType !== null;

  return `<div class="select-screen">
    <p class="select-heading">Choose a drill</p>
    <div class="drill-cards">${drillCards}</div>
    <hr class="select-divider">
    ${notice}
    <div class="round-row">
      <span class="round-label">Questions</span>
      <div class="round-btns">${roundBtns}</div>
    </div>
    <button class="btn-start" onclick="startQuiz()" ${canStart ? '' : 'disabled'}>Start</button>
  </div>`;
}

// ── Screen 2 ──
function renderQuiz() {
  const q = state.questions[state.currentIndex];
  const total = state.questions.length;
  const num = state.currentIndex + 1;
  const pct = Math.round((num / total) * 100);

  const drillNames = {
    'kanji-to-reading': 'Kanji → Reading',
    'reading-to-kanji': 'Reading → Kanji',
    'katakana-reading': 'Katakana Reading',
  };
  const drillName = drillNames[state.drillType] || '';

  let questionHTML = '';
  if (state.drillType === 'kanji-to-reading') {
    questionHTML = `<div class="q-kanji">${q.word.w}</div>`;
  } else if (state.drillType === 'reading-to-kanji') {
    questionHTML = `<div class="q-reading">${q.word.r}</div><div class="q-meaning">${q.word.m}</div>`;
  } else {
    questionHTML = `<div class="q-kanji">${q.katakana.k}</div><p class="katakana-english"></p>`;
  }

  const keys = ['A', 'B', 'C', 'D'];
  const optionItems = q.options.map((opt, i) => {
    let text = '';
    if (state.drillType === 'kanji-to-reading') {
      text = `<span>${opt.r}</span> <span class="opt-en">• ${opt.m}</span>`;
    } else if (state.drillType === 'reading-to-kanji') {
      text = `<span>${opt.w}</span>`;
    } else {
      text = `<span>${opt.h}</span>`;
    }
    const ariaLabel = state.drillType === 'kanji-to-reading'
      ? `${keys[i]}: ${opt.r}, ${opt.m}`
      : state.drillType === 'reading-to-kanji'
        ? `${keys[i]}: ${opt.w}`
        : `${keys[i]}: ${opt.h}`;

    return `<li>
      <button class="btn-option" data-index="${i}" onclick="handleAnswer(${i})"
        ${state.answered ? 'disabled' : ''}
        aria-label="${ariaLabel}">
        <span class="option-key">${keys[i]}</span>
        <span class="option-text">${text}</span>
      </button>
    </li>`;
  }).join('');

  return `<div class="quiz-card card">
    <div class="card-header">
      <span class="card-drill-name">${drillName}</span>
      <span class="card-progress-text">${num} / ${total}</span>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" style="width: ${pct}%"></div>
    </div>
    <div class="question-area">${questionHTML}</div>
    <div class="example-reveal" id="exampleReveal">
      <hr class="example-divider">
      <p class="example-jp" id="exampleJp"></p>
      <p class="example-en" id="exampleEn"></p>
    </div>
    <button class="btn-next" id="btnNext" hidden onclick="advanceFromNext()">Next →</button>
    <ul class="options-list">${optionItems}</ul>
  </div>`;
}

// ── Screen 3 ──
function renderResults() {
  const total = state.questions.length;
  const score = state.score;
  const pct = Math.round((score / total) * 100);
  const s = getStreak();
  const showSyncHint = !!(lastStreakResult && lastStreakResult.increased && lsGet(LS_GH_TOKEN));
  return `<div class="results-card">
    <p class="results-label">Results</p>
    <div class="results-score">${score} / ${total}</div>
    <div class="results-pct">${pct}% correct</div>
    <p class="results-streak">🔥 <strong>${s.current}</strong> day streak &nbsp;·&nbsp; Best: <strong>${s.best}</strong></p>
    ${showSyncHint ? '<p class="results-sync-hint">Open the vocab app to sync your streak across devices</p>' : ''}
    <div class="results-btns">
      <button class="btn-results" onclick="tryAgain()">Try again — same drill</button>
      <button class="btn-results" onclick="changeDrill()">Change drill</button>
    </div>
  </div>`;
}

// ═══════════════════════════════════════════════════════════════
//  ACTIONS
// ═══════════════════════════════════════════════════════════════
function selectDrill(id) {
  state.drillType = id;
  render();
}

function setRoundLength(n) {
  state.roundLength = n;
  lsSet(LS_ROUND_LEN, String(n));
  render();
}

function startQuiz() {
  if (!state.drillType) return;
  state.questions    = buildQuestions();
  state.currentIndex = 0;
  state.score        = 0;
  state.answered     = false;
  state.screen       = 'quiz';
  render();
}

function advanceQuestion() {
  state.currentIndex++;
  state.answered = false;
  if (state.currentIndex >= state.questions.length) {
    state.screen = 'results';
    const result = recordActivity();
    lastStreakResult = result;
    render();
    if (result && result.increased) {
      const chip = document.getElementById('streakChip');
      if (chip) {
        chip.classList.add('just-increased');
        setTimeout(() => chip.classList.remove('just-increased'), 600);
      }
    }
    renderStreakChip();
  } else {
    render();
  }
}

function advanceFromNext() {
  const btnNext = document.getElementById('btnNext');
  if (btnNext) btnNext.hidden = true;
  advanceQuestion();
}

function handleAnswer(optionIndex) {
  if (state.answered) return;
  state.answered = true;

  const q = state.questions[state.currentIndex];
  const chosen = q.options[optionIndex];
  const isCorrect = chosen.isCorrect;
  if (isCorrect) state.score++;

  // Apply visual feedback immediately
  const buttons = document.querySelectorAll('.btn-option');
  buttons.forEach(btn => { btn.disabled = true; });
  buttons[optionIndex].classList.add(isCorrect ? 'correct' : 'wrong');
  if (!isCorrect) {
    const correctIdx = q.options.findIndex(o => o.isCorrect);
    if (correctIdx >= 0) buttons[correctIdx].classList.add('correct');
  }

  // Reveal English meaning for katakana drill
  if (state.drillType === 'katakana-reading') {
    const engEl = document.querySelector('.katakana-english');
    if (engEl) {
      engEl.textContent = q.katakana.e;
      // Force reflow so transition fires even if reduced-motion skips it
      engEl.getBoundingClientRect();
      engEl.classList.add('visible');
    }
  }

  // Reveal example sentence on correct answer (kanji/reading drills only)
  if (isCorrect && q.word && Array.isArray(q.word.ex) && q.word.ex.length > 0 &&
      (state.drillType === 'kanji-to-reading' || state.drillType === 'reading-to-kanji')) {
    const revealEl = document.getElementById('exampleReveal');
    const jpEl     = document.getElementById('exampleJp');
    const enEl     = document.getElementById('exampleEn');
    if (revealEl && jpEl && enEl) {
      const firstEx = q.word.ex[0];
      if (firstEx) {
        jpEl.textContent = firstEx.jp || '';
        enEl.textContent = firstEx.en || '';
        revealEl.getBoundingClientRect();
        revealEl.classList.add('visible');
      } else {
        revealEl.classList.remove('visible');
      }
    }
  }

  if (isCorrect) {
    const btnNext = document.getElementById('btnNext');
    if (btnNext) btnNext.hidden = false;
  } else {
    setTimeout(advanceQuestion, 800);
  }
}

function tryAgain() {
  state.questions    = buildQuestions();
  state.currentIndex = 0;
  state.score        = 0;
  state.answered     = false;
  state.screen       = 'quiz';
  render();
}

function changeDrill() {
  state.screen    = 'select';
  state.drillType = null;
  render();
}

// ═══════════════════════════════════════════════════════════════
//  THEME
// ═══════════════════════════════════════════════════════════════
function toggleMode() {
  const isLight = document.body.classList.toggle('light');
  const sym = isLight ? '🌙' : '☀';
  const btn = document.getElementById('btnMode');
  if (btn) {
    btn.textContent = sym;
    btn.setAttribute('aria-pressed', String(isLight));
  }
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', isLight ? '#f5efe3' : '#0e0d0b');
  lsSet(LS_MODE, isLight ? 'light' : 'dark');
}

// ═══════════════════════════════════════════════════════════════
//  KEYBOARD
// ═══════════════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (state.screen !== 'quiz') return;
  const map = { 'a': 0, 'b': 1, 'c': 2, 'd': 3 };
  const key = e.key.toLowerCase();
  if (key in map) {
    e.preventDefault();
    if (!state.answered) handleAnswer(map[key]);
  }
  // Block arrow key navigation during quiz
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') e.preventDefault();
  // Advance via Next button with Enter/Space
  if ((e.key === 'Enter' || e.key === ' ') && state.answered) {
    const btnNext = document.getElementById('btnNext');
    if (btnNext && !btnNext.hidden) { e.preventDefault(); advanceFromNext(); }
  }
});

// ═══════════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════════
function init() {
  const mode = lsGet(LS_MODE);
  if (mode === 'light') {
    document.body.classList.add('light');
    const btn = document.getElementById('btnMode');
    if (btn) { btn.textContent = '🌙'; btn.setAttribute('aria-pressed', 'true'); }
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute('content', '#f5efe3');
  }
  const savedLen = parseInt(lsGet(LS_ROUND_LEN), 10);
  if ([5, 10, 20].includes(savedLen)) state.roundLength = savedLen;
  render();
  renderStreakChip();
  syncStreakFromGist();
}

init();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js', {
      updateViaCache: 'none'
    }).catch(err => console.warn('SW registration failed:', err));
  });
  navigator.serviceWorker.addEventListener('message', event => {
    if (event.data && event.data.type === 'SW_UPDATED') {
      window.location.reload();
    }
  });
}
</script>
